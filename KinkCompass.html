}

/* ---------- Knotensteuerung (Vererbung) ---------- */
/* `items` sind die im Modus sichtbaren Punkte — sie entscheiden, ob die Zeile
   ueberhaupt erscheint. `reach` ist, was die Bewertung tatsaechlich erreicht:
   die Vererbung kennt keinen Modus und wirkt auch auf Punkte, die gerade
   ausgeblendet sind. Beides auseinanderzuhalten ist noetig, weil die Zahl in
   der Beschriftung sonst luegt — in „Hochrisiko" stand (17), gewirkt haette
   die Bewertung auf 44. */
function nodeControls(nk,items,noInherit,capText,reach){
  const box=el('div','ghead nodectl');
  if(!hasWunsch(items)) { return null; }
  if(noInherit){
    /* Wo die Punkte Alternativen sind, waere eine Bewertung fuer alle sinnlos.
       Das Ueberspringen bleibt trotzdem nuetzlich. */
    const cap=el('div','nodecap',L(T.noInherit));
    cap.title=noInherit; box.appendChild(cap);
    const sk=el('button','btn sm'+(ST.skip[nk]?' on':''),L(T.skip));
    sk.type='button';
    sk.onclick=(e)=>{e.stopPropagation();
      if(ST.skip[nk])delete ST.skip[nk]; else ST.skip[nk]=1; save(); rerender();};
    box.appendChild(sk);
    return box;
  }
  /* Ohne Beschriftung sieht diese Zeile aus wie ein Item ohne Namen. */
  const what=nk.indexOf('T:')===0?L(T.allTheme)
           :nk.indexOf('S:')===0?L(T.allSec):L(T.allGrp);
  const alle=reach||items;
  /* Auf Themenebene bleiben Risiko-Items und NUR-EINZELN-Sektionen aussen vor. */
  const gesperrt=nk.charAt(0)==='T'?alle.filter(it=>it.risk||it.nosweep):[];
  const trifft=alle.length-gesperrt.length;
  const cap=el('div','nodecap',capText||(what+' ('+trifft+')'));
  cap.title=capText?L(T.ekatWhy):L(T.inheritWhy);
  box.appendChild(cap);
  if(gesperrt.length){
    box.appendChild(el('div','nodewarn',L(T.katAus).replace('#',String(gesperrt.length))));
  }
  const ap=nodeIsAp(items);
  const mk=(role)=>{
    const cur=ST.nodeW[nk+role]||'';
    const row=chipRow(wunschOpts(),cur,(v)=>{
      if(v)ST.nodeW[nk+role]=v; else delete ST.nodeW[nk+role];
      save(); rerender();
    },ap?LB(ROLE[role.slice(1)||'a']):null,false,null);
    styleSel(row,'wunsch');
    return row;
  };
  const col=el('div','axes');
  if(ap){col.appendChild(mk('#a'));col.appendChild(mk('#p'));}
  else col.appendChild(mk(''));
  box.appendChild(col);
  const sk=el('button','btn sm'+(ST.skip[nk]?' on':''),L(T.skip));
  sk.type='button';
  sk.onclick=(e)=>{e.stopPropagation();
    if(ST.skip[nk])delete ST.skip[nk]; else ST.skip[nk]=1; save(); rerender();};
  box.appendChild(sk);
  return box;
}

/* ---------- Item ---------- */
function itemRow(it){
  const row=el('div','row'); row.dataset.id=it.id;
  const main=el('div','rowmain');
  const lbl=el('div','lbl');
  const expl=LB({de:it.expl_de,en:it.expl_en});
  if(expl){const i=el('div','i','i'); i.title=expl;
    i.onclick=()=>row.classList.toggle('showexpl'); lbl.appendChild(i);}
  const name=el('span',null,LB({de:it.de,en:it.en}));
  lbl.appendChild(name);
  if(it.risk){const b=el('span','badge '+it.risk,LB(it.risk==='hoch'
    ?{de:'Risiko hoch',en:'high risk'}:{de:'Risiko mittel',en:'moderate risk'}));
    b.style.marginLeft='6px'; lbl.appendChild(b);}
  if(isSkipped(it)){const b=el('span','badge skip',L(T.skip));
    b.style.marginLeft='6px'; lbl.appendChild(b);}
  main.appendChild(lbl);
  const axes=el('div','axes');

  if(it.kind==='wunsch'){
    it.units.forEach(u=>{
      const e=effW(it,u), ew=e.v;
      const r=chipRow(wunschOpts(),ew,(v)=>{
        if(v)ST.w[it.id+u]=v; else delete ST.w[it.id+u];
        if(v==='hard'&&ST.p[it.id+u]==='echt') delete ST.p[it.id+u];
        save(); rerender();
      },it.ap?LB(roleOf(it,u)):null,e.src==='inh',null);
      styleSel(r,'wunsch'); axes.appendChild(r);
      if(showAx('showP',it)){
        const ep=effP(it,u);
        const pr=chipRow(strafeOpts(u),ep.v,(v)=>{
          if(v)ST.p[it.id+u]=v; else delete ST.p[it.id+u];
          save(); rerender();
        },L(u==='#a'?T.strafeGeben:u==='#p'?T.strafeNehmen:T.strafeAx),
          ep.src==='inh',ew==='hard'?['echt']:null);
        styleSel(pr,'strafe'); axes.appendChild(pr);
      }
      if(showAx('showX',it)&&!ST.noExp){
        const xr=chipRow(SC.erfahrung,ST.x[it.id+u]||'',(v)=>{
          if(v)ST.x[it.id+u]=v; else delete ST.x[it.id+u]; save(); rerender();
        },L(T.expAx),false,null);
        styleSel(xr,'erfahrung'); axes.appendChild(xr);
      }
    });
    const tail=el('div','axrow');
    const ef=effF(it);
    const fb=el('button','chip'+(ef.v?' sel':'')+(ef.src==='inh'?' inh':''),L(T.fantasy));
    fb.type='button';
    fb.onclick=()=>{if(ST.f[it.id])delete ST.f[it.id]; else ST.f[it.id]=1; save(); rerender();};
    if(ef.v)fb.style.background='var(--c-sehnsucht)';
    tail.appendChild(fb);
    if(showAx('showSt',it)){
      it.units.forEach(u=>{
        const on=!!ST.star[it.id+u];
        const sb=el('button','chip star'+(on?' sel':''),
          '★'+(it.ap?' '+LB(roleOf(it,u)):''));
        sb.type='button'; sb.title=L(T.star);
        sb.onclick=()=>{if(on)delete ST.star[it.id+u];
          else{ST.star[it.id+u]=1; if(ST.rank.indexOf(it.id+u)<0)ST.rank.push(it.id+u);}
          save(); rerender();};
        tail.appendChild(sb);
      });
    }
    const nb=el('button','chip'+(ST.notes[it.id]&&ST.notes[it.id].t?' sel':''),L(T.note));
    nb.type='button'; nb.onclick=()=>row.classList.toggle('showcmt');
    tail.appendChild(nb);
    if(!(ST.showP&&ST.showX&&ST.showSt)){
      const mb=el('button','chip'+(ST.more[it.id]?' sel':''),ST.more[it.id]?'−':'＋');
      mb.type='button'; mb.title=L(T.moreAx);
      mb.onclick=()=>{if(ST.more[it.id])delete ST.more[it.id]; else ST.more[it.id]=1;
        save(); rerender();};
      tail.appendChild(mb);
    }
    axes.appendChild(tail);
  }
  else if(it.kind==='text'){
    const ta=el('textarea'); ta.value=ST.tx[it.id]||'';
    ta.oninput=()=>{ST.tx[it.id]=ta.value; save(); updateProgress();};
    const box=el('div','tfield'); box.style.flex='1'; box.style.minWidth='260px';
    box.appendChild(ta); main.appendChild(box);
  }
  else {
    const opts=optsOf(it.kind);
    it.units.forEach(u=>{
      const r=chipRow(opts,agOf(it,u),(v)=>{ agSet(it,u,v); save(); rerender(); },
        u?LB(roleOf(it,u)):null,false,null);
      styleSel(r,it.kind); axes.appendChild(r);
    });
    const tail=el('div','axrow');
    const nb=el('button','chip'+(ST.notes[it.id]&&ST.notes[it.id].t?' sel':''),L(T.note));
    nb.type='button'; nb.onclick=()=>row.classList.toggle('showcmt');
    tail.appendChild(nb); axes.appendChild(tail);
  }

  if(it.kind!=='text') main.appendChild(axes);
  row.appendChild(main);
  /* Nur eigene Antwortsätze erklären wir am Item. Die Standard-Skalen stehen
     in der Legende — sonst stünde dieselbe Liste unter jeder Zeile. */
  const opts2=(it.scale&&it.kind!=='text')?optsOf(it.kind):null;
  if(expl||(opts2&&hasDesc(opts2))){
    const e=el('div','expl');
    if(expl) e.appendChild(el('div',null,expl));
    if(opts2&&hasDesc(opts2)){
      const ul=el('ul'); ul.style.cssText='margin:5px 0 0;padding-left:16px';
      opts2.forEach(o=>{
        const d=LB({de:o.dde,en:o.den}); if(!d) return;
        const li=el('li'); li.style.margin='2px 0';
        const b=el('b',null,LB(o)); b.style.color='var(--txt)';
        li.appendChild(b); li.appendChild(el('span',null,' — '+d));
        ul.appendChild(li);
      });
      e.appendChild(ul);
    }
    row.appendChild(e);
  }
  if(it.kind!=='text'){
    const c=el('div','cmt');
    const ta=el('textarea'); ta.value=(ST.notes[it.id]||{}).t||'';
    ta.placeholder=L(T.note);
    ta.oninput=()=>{ST.notes[it.id]=ST.notes[it.id]||{};
      ST.notes[it.id].t=ta.value; save();};
    c.appendChild(ta);
    const bar=el('div','cmtbar');
    const cb=el('input'); cb.type='checkbox';
    cb.checked=!!(ST.notes[it.id]||{}).sh;
    cb.onchange=()=>{ST.notes[it.id]=ST.notes[it.id]||{};
      ST.notes[it.id].sh=cb.checked; save();};
    const lb=el('label'); lb.style.display='flex'; lb.style.gap='5px';
    lb.appendChild(cb); lb.appendChild(el('span',null,L(T.shared)));
    bar.appendChild(lb); c.appendChild(bar);
    row.appendChild(c);
  }
  return row;
}
/* Strafe und Erfahrung sind global aus und werden bewusst eingeblendet —
   entweder oben fuer alle, oder per ＋ nur fuer dieses eine Item. */
/* Im Einstieg bleiben Strafe und Erfahrung aus. Wer das Thema zum ersten Mal
   anschaut, soll eine Frage pro Zeile beantworten, nicht drei. Das ＋ am Item
   bleibt trotzdem erreichbar, falls jemand genauer hinsehen will. */
const showAx=(k,it)=>{
  if(ST.mode==='e'&&(k==='showP'||k==='showX')) return !!(it&&ST.more[it.id]);
  return !!ST[k]||!!(it&&ST.more[it.id]);
};

/* ---------- Multi / Toys ---------- */
function multiBlock(s,items){
  const g=el('div','multi');
  const sel=ST.multi[s.id]||(ST.multi[s.id]=[]);
  items.forEach(it=>{
    const w=el('label','mi');
    const cb=el('input'); cb.type='checkbox'; cb.checked=sel.indexOf(it.id)>=0;
    cb.onchange=()=>{const i=sel.indexOf(it.id);
      if(cb.checked){if(i<0)sel.push(it.id);} else if(i>=0)sel.splice(i,1);
      save();};
    w.appendChild(cb);
    const t=el('div','t',LB({de:it.de,en:it.en}));
    const ex=LB({de:it.expl_de,en:it.expl_en});
    if(ex){const e=el('div','expl',ex); e.style.display='block'; e.style.paddingLeft='0';
      e.style.marginTop='2px'; t.appendChild(e);}
    w.appendChild(t); g.appendChild(w);
  });
  return g;
}
function toysBlock(){
  const box=el('div','toys');
  const draw=()=>{
    box.innerHTML='';
    ST.toys.forEach((v,i)=>{
      const r=el('div','toy');
      const inp=el('input'); inp.type='text'; inp.value=v;
      inp.oninput=()=>{ST.toys[i]=inp.value; save();};
      const d=el('button','btn sm','×'); d.type='button';
      d.onclick=()=>{ST.toys.splice(i,1); save(); draw();};
      r.appendChild(inp); r.appendChild(d); box.appendChild(r);
    });
    const add=el('button','btn sm','+');
    add.type='button'; add.onclick=()=>{ST.toys.push(''); save(); draw();};
    box.appendChild(add);
  };
  draw(); return box;
}

/* ---------- Sektion ---------- */
function secBody(s){
  const body=el('div','nbody');
  const note=LB({de:s.note_de,en:s.note_en});
  if(note) body.appendChild(noteEl(note));
  const items=visItems(s);
  /* Die Toys-Liste hat bauartbedingt keine Items — sie ist eine freie Liste.
     Stand diese Abfrage hinter der Leerpruefung, brach sie dort ab und zeigte
     nur einen Strich: kein Eingabefeld, kein Plus, obwohl der Hinweis daneben
     „Mit Plus hinzufuegen" sagte. */
  if(s.type==='toys'){ body.appendChild(toysBlock()); return body; }
  if(!items.length){
    const m=el('div','secnote',ST.mode==='e'?L(T.notAsked):'—');
    m.style.borderLeftColor='var(--gold)'; body.appendChild(m); return body;
  }
  if(s.type==='multi'){ body.appendChild(multiBlock(s,items)); return body; }
  /* Im Einstieg bleibt die Vererbung auf der Themenebene. Sonst staenden ueber
     neun Fragen sieben Bedienzeilen — das ist keine Vereinfachung mehr. */
  const nc=ST.mode==='e'?null:nodeControls('S:'+s.id,items,s.noinherit,null,s.items);
  if(nc&&!s.exempt){nc.style.marginBottom='8px'; body.appendChild(nc);}
  s.groups.forEach(g=>{
    const gi=items.filter(it=>it.group===g.id);
    if(!gi.length) return;
    const blk=el('div','grp');
    const gh=el('div','ghead');
    gh.appendChild(el('h5',null,LB({de:g.title_de,en:g.title_en})+' ('+gi.length+')'));
    blk.appendChild(gh);
    if(!s.exempt&&ST.mode!=='e'){
      const nc2=nodeControls('G:'+s.id+'.'+g.id,gi,s.noinherit,null,
        s.items.filter(it=>it.group===g.id));
      if(nc2) blk.appendChild(nc2);
    }
    if(!nodeSkipped('G:'+s.id+'.'+g.id)||s.exempt)
      gi.forEach(it=>blk.appendChild(itemRow(it)));
    body.appendChild(blk);
  });
  const ung=items.filter(it=>!it.group);
  ung.forEach(it=>body.appendChild(itemRow(it)));
  s.dropped.forEach(d=>{
    const m=el('div','secnote',(ST.lang==='en'?'Omitted: ':'Ausgelassen: ')+d.de+' — '+d.reason);
    body.appendChild(m);
  });
  return body;
}
function secNode(s){
  const n=el('div','node'+(s.exempt?' exempt':'')); n.dataset.sec=s.id;
  const h=el('div','nhead');
  h.appendChild(el('div','tw','▶'));
  const t=el('div','ntitle');
  t.appendChild(el('h4',null,LB({de:s.title_de,en:s.title_en})));
  const vi=visItems(s);
  const cnt=countUnits(vi);
  const risk=vi.filter(it=>it.risk).length;
  const riskWord=ST.lang==='en'?'risk':'Risiko';
  t.appendChild(el('div','nmeta',vi.length+' '+(ST.lang==='en'?'items':'Items')+' · '+cnt.set+'/'+cnt.tot+
    (risk?' · '+risk+' '+riskWord:'')+(ST.skip['S:'+s.id]?' · '+L(T.skip):'')));
  h.appendChild(t);
  n.appendChild(h);
  const open=!!ST.open['S:'+s.id];
  if(open){n.classList.add('open'); n.appendChild(secBody(s));}
  h.onclick=()=>{ST.open['S:'+s.id]=!ST.open['S:'+s.id]; save(); rerender();};
  return n;
}
function themeNode(t){
  const n=el('div','node theme'+(t.exempt?' exempt':'')); n.dataset.theme=t.id;
  const h=el('div','nhead');
  h.appendChild(el('div','tw','▶'));
  const ti=el('div','ntitle');
  ti.appendChild(el('h3',null,t.order+'. '+LB({de:t.title_de,en:t.title_en})));
  const vi=visOfTheme(t);
  const ekat=isEkat(t);
  const cnt=countUnits(vi);
  ti.appendChild(el('div','nmeta',ekat
    ?L(T.ekatCap)
    /* „0 Sektionen · 0 Items · 0/0" ist eine tote Zeile mit sinnlosem Zaehler. */
    :(ST.mode==='e'&&!vi.length)?L(T.notAskedShort)
    :(ST.mode==='e'?t.sections.filter(x=>visItems(x).length).length:t.sections.length)+
     ' '+(ST.lang==='en'?'sections':'Sektionen')+' · '+vi.length+
     ' '+(ST.lang==='en'?'items':'Items')+' · '+cnt.set+'/'+cnt.tot+
     (ST.skip['T:'+t.id]?' · '+L(T.skip):'')));
  h.appendChild(ti);
  n.appendChild(h);
  if(ST.open['T:'+t.id]){
    n.classList.add('open');
    const body=el('div','nbody');
    if(ekat){
      const was=LB({de:t.ekat_de,en:t.ekat_en});
      if(was){const d=el('div','ekatwas'); d.textContent=was; body.appendChild(d);}
      body.appendChild(noteEl(L(T.ekatWhy)));
      const nc=nodeControls('T:'+t.id,allItems(t),null,L(T.ekatShort));
      if(nc) body.appendChild(nc);
      n.appendChild(body);
    }else if(ST.mode==='e'&&!vi.length){
      const m=el('div','secnote',L(T.notAskedTheme));
      m.style.borderLeftColor='var(--gold)'; body.appendChild(m);
      n.appendChild(body);
    }else{
      if(!t.exempt){
        const alleOhne=t.sections.every(x=>x.noinherit||x.type!=='scale');
        const nc=nodeControls('T:'+t.id,vi,
          alleOhne?t.sections.map(x=>x.noinherit).filter(Boolean)[0]:null,
          null,allItems(t));
        if(nc){nc.style.marginBottom='8px'; body.appendChild(nc);}
      }
      /* Eine Ueberschrift ohne Inhalt ist im Einstieg genau das, was ueberfrachtet.
         Verschwiegen wird trotzdem nichts — die Zahl steht darunter. */
      const zeig=ST.mode==='e'?t.sections.filter(s=>visItems(s).length):t.sections;
      zeig.forEach(s=>body.appendChild(secNode(s)));
      const weg=t.sections.length-zeig.length;
      if(weg>0) body.appendChild(el('div','secnote',
        weg+' '+L(weg===1?T.moreSec1:T.moreSecs)));
      n.appendChild(body);
    }
  }
  h.onclick=()=>{ST.open['T:'+t.id]=!ST.open['T:'+t.id]; save(); rerender();};
  return n;
}
function renderForm(){
  const v=document.getElementById('vForm'); v.innerHTML='';
  const sw=switchBlock(); if(sw) v.appendChild(sw);
  THEMES.forEach(t=>v.appendChild(themeNode(t)));
}
</script>
<script>
"use strict";
/* ==================== Einstiegs-Schalter ==================== */
function switchBlock(){
  /* Vier Schalter ueber zusaetzliche Achsen sind im Einstieg genau das,
     was ueberfordert — dort erklaert stattdessen ein Satz, worum es geht. */
  if(ST.mode==='e') return einstiegBlock();
  const c=el('div','card');
  c.appendChild(el('h3',null,L(T.axBar)));
  c.appendChild(el('div','hint',ST.lang==='en'
    ?'Off by default so a row stays readable. With ＋ on a single item you can show them just there.'
    :'Standardmäßig aus, damit eine Zeile lesbar bleibt. Mit ＋ an einem einzelnen Punkt blendest du sie nur dort ein.'));
  const row=el('div','axrow');
  [['showP',T.showP],['showX',T.showX],['showSt',T.showSt],['noExp',T.noExp]].forEach(([k,lab])=>{
    const b=el('button','chip'+(ST[k]?' sel':''),L(lab)); b.type='button';
    if(ST[k])b.style.background='var(--accent)';
    b.onclick=()=>{ST[k]=!ST[k]; save(); rerender();};
    row.appendChild(b);
  });
  c.appendChild(row);
  return c;
}

function einstiegBlock(){
  const en=ST.lang==='en', c=el('div','card');
  c.appendChild(el('h3',null,en?'Getting started':'Einstieg'));
  const p=el('div','hint');
  p.innerHTML=en
    ?'A first rough map — about fifty questions, nothing extreme. Rate what you '+
     'recognise, leave the rest open: <b>not asked is not the same as refused</b>. '+
     'Areas you only see as a heading are rated as a whole; that is enough to compare '+
     'with someone else\'s profile. Switch to <b>Standard</b> whenever you want detail.'
    :'Eine erste grobe Karte — rund fünfzig Fragen, nichts Drastisches. Bewerte, was '+
     'du wiedererkennst, und lass den Rest offen: <b>nicht gefragt heißt nicht '+
     'abgelehnt</b>. Bereiche, die du nur als Überschrift siehst, bewertest du im '+
     'Ganzen — das genügt, um dein Profil mit einem anderen zu vergleichen. '+
     'In den <b>Standard</b>modus kannst du jederzeit wechseln.';
  c.appendChild(p);
  return c;
}

/* ==================== Skalen-Legende ==================== */
function legendBlock(){
  const en=ST.lang==='en', c=el('div','card');
  c.appendChild(el('h3',null,en?'What the scales mean':'Was die Skalen bedeuten'));
  const part=(title,opts,note)=>{
    c.appendChild(el('h5',null,title));
    if(note) c.appendChild(el('div','hint',note));
    const ul=el('ul'); ul.style.cssText='margin:4px 0 12px;padding-left:18px';
    opts.forEach(o=>{
      const li=el('li'); li.style.margin='3px 0';
      const b=el('b',null,LB(o));
      const col={must:'must',neigung:'neigung',sehnsucht:'sehnsucht',interessant:'interessant',
        neutral:'neutral',soft:'soft',hard:'hard',na:'na',reizvoll:'reizvoll',echt:'echt',
        verbindlich:'verbindlich',gewuenscht:'gewuenscht',verhandelbar:'verhandelbar',
        'nicht-noetig':'nicht-noetig',ablehnend:'ablehnend',
        keine:'keine',einmal:'einmal',gelegentlich:'gelegentlich',viel:'viel'}[o.v];
      if(col) b.style.color='var(--c-'+col+')';
      li.appendChild(b);
      const d=LB({de:o.dde,en:o.den});
      if(d) li.appendChild(el('span',null,' — '+d));
      ul.appendChild(li);
    });
    c.appendChild(ul);
  };
  part(en?'Desire scale':'Wunsch-Skala', wunschOpts(),
    en?'One step per item. In getting-started mode a subset of the same codes is shown.'
      :'Eine Stufe pro Punkt. Im Einstiegsmodus wird eine Teilmenge derselben Codes gezeigt.');
  part(en?'Punishment axis — bottom':'Strafe-Achse — Bottom', strafeOpts('#p'),
    en?'Separate from the desire scale, because a punishment that arouses is not a punishment. A hard limit rules out real punishment.'
      :'Getrennt von der Wunsch-Skala, weil eine Strafe, die erregt, keine Strafe ist. Hard Limit schließt „echte Strafe" aus.');
  part(en?'Punishment axis — top':'Strafe-Achse — Top', strafeOpts('#a'),
    en?'On this side the question is different: are you willing to impose it?'
      :'Auf dieser Seite lautet die Frage anders: bist du bereit, es zu verhängen?');
  part(en?'Experience':'Erfahrung', SC.erfahrung,
    en?'Independent of desire: “hard limit, but experienced” and “must-have, never tried” are both valid.'
      :'Unabhängig vom Wunsch: „Hard Limit, aber erlebt" und „Must-have, nie probiert" sind beide gültig.');
  part(en?'Agreement scale':'Vereinbarungs-Skala', SC.vereinbarung,
    en?'Used in Framework and safety. These are conditions, not preferences — never inherited.'
      :'Gilt in Rahmen und Sicherheit. Das sind Bedingungen, keine Vorlieben — nie vererbt.');
  const lm=optsOf('leitmodell');
  if(lm&&lm.length) part(en?'Risk models':'Risikomodelle', lm,
    en?'The frameworks the scene works by. They differ in how they treat risk — which is why the comparison flags a mismatch.'
      :'Die Modelle, nach denen in der Szene gearbeitet wird. Sie unterscheiden sich im Umgang mit Risiko — deshalb weist der Vergleich einen Unterschied aus.');
  return c;
}
function toggleLegend(){
  const v=document.getElementById('vLegend');
  const on=v.style.display!=='block';
  v.style.display=on?'block':'none';
  v.innerHTML=''; if(on) v.appendChild(legendBlock());
  document.getElementById('bLegend').classList.toggle('on',on);
}

/* ==================== Gefuehrter Ablauf ==================== */
function stepList(){
  /* Ein Schritt, der nichts zeigt, ist im gefuehrten Ablauf reine Irritation. */
  const steps=THEMES.filter(themeShown).map(t=>({t:t}));
  steps.push({prio:true});
  return steps;
}
function renderGuide(){
  const v=document.getElementById('vGuide'); v.innerHTML='';
  const steps=stepList();
  if(ST.step>=steps.length) ST.step=steps.length-1;
  if(ST.step<0) ST.step=0;
  const sw=switchBlock(); if(sw) v.appendChild(sw);

  const nav=el('div','card');
  nav.appendChild(el('h3',null,(ST.lang==='en'?'Step ':'Schritt ')+(ST.step+1)+
    (ST.lang==='en'?' of ':' von ')+steps.length));
  const ul=el('ul','steps');
  steps.forEach((s,i)=>{
    const li=el('li',i===ST.step?'cur':'');
    li.appendChild(el('span','sn',String(i+1)));
    const d=el('div','sd');
    if(s.prio){ d.appendChild(el('div',null,ST.lang==='en'
        ?'Priorities — what matters most?':'Prioritäten — was ist dir am wichtigsten?')); }
    else{
      d.appendChild(el('div',null,LB({de:s.t.title_de,en:s.t.title_en})));
      if(isEkat(s.t)){
        d.appendChild(el('div','ss',ST.nodeW['T:'+s.t.id]||ST.nodeW['T:'+s.t.id+'#a']
          ||ST.nodeW['T:'+s.t.id+'#p']?'1/1 '+L(T.setCount):'0/1 '+L(T.setCount)));
      }else{
        const c=countUnits(visOfTheme(s.t));
        d.appendChild(el('div','ss',c.set+'/'+c.tot+' '+L(T.setCount)+
          (c.clar>c.set?' · '+c.clar+' '+L(T.clarCount):'')));
      }
    }
    li.appendChild(d);
    li.onclick=()=>{ST.step=i; save(); rerender();};
    ul.appendChild(li);
  });
  nav.appendChild(ul); v.appendChild(nav);

  const cur=steps[ST.step];
  if(cur.prio) v.appendChild(prioBlock());
  else{
    const t=cur.t;
    const box=el('div');
    if(isEkat(t)){
      const n=el('div','node open');
      /* Ohne Kopf liest man „Wie sehr interessiert dich dieser Bereich?" und
         erfaehrt nirgends, welcher gemeint ist — die Schrittliste steht weit oben. */
      const h=el('div','nhead');
      const ti=el('div','ntitle');
      ti.appendChild(el('h4',null,t.order+'. '+LB({de:t.title_de,en:t.title_en})));
      h.appendChild(ti); n.appendChild(h);
      const b=el('div','nbody');
      const was=LB({de:t.ekat_de,en:t.ekat_en});
      if(was){const d=el('div','ekatwas'); d.textContent=was; b.appendChild(d);}
      b.appendChild(noteEl(L(T.ekatWhy)));
      const nc=nodeControls('T:'+t.id,allItems(t),null,L(T.ekatShort));
      if(nc) b.appendChild(nc);
      n.appendChild(b); box.appendChild(n); v.appendChild(box);
    }else{
      const zeig=ST.mode==='e'?t.sections.filter(s=>visItems(s).length):t.sections;
      zeig.forEach(s=>{
        const n=el('div','node'+(s.exempt?' exempt':'')+' open');
        const h=el('div','nhead');
        const ti=el('div','ntitle');
        ti.appendChild(el('h4',null,LB({de:s.title_de,en:s.title_en})));
        h.appendChild(ti); n.appendChild(h);
        n.appendChild(secBody(s));
        box.appendChild(n);
      });
      const weg=t.sections.length-zeig.length;
      if(weg>0) box.appendChild(el('div','secnote',
        weg+' '+L(weg===1?T.moreSec1:T.moreSecs)));
      v.appendChild(box);
    }
  }
  const gn=el('div','gnav');
  const b1=el('button','btn',ST.lang==='en'?'‹ Back':'‹ Zurück');
  b1.onclick=()=>{ST.step=Math.max(0,ST.step-1); save(); rerender();
    window.scrollTo(0,0);};
  const b2=el('button','btn pri',ST.lang==='en'?'Next ›':'Weiter ›');
  b2.onclick=()=>{ST.step=Math.min(steps.length-1,ST.step+1); save(); rerender();
    window.scrollTo(0,0);};
  gn.appendChild(b1); gn.appendChild(b2); v.appendChild(gn);
}

/* ==================== Prioritaeten ==================== */
function unitLabel(key){
  /* lazy .*? wuerde die Rolle mitschlucken — deshalb ausdruecklich am Ende pruefen */
  const role=/#[ap]$/.test(key)?key.slice(-2):'';
  const id=role?key.slice(0,-2):key;
  const it=IDX.byId[id]; if(!it) return null;
  return {it:it,role:role,name:LB({de:it.de,en:it.en}),
    sec:LB({de:IDX.sec[it.sec].title_de,en:IDX.sec[it.sec].title_en}),
    roleName:role?LB(roleOf(it,role)):''};
}
function starredUnits(){
  const out=[];
  Object.keys(ST.star).forEach(k=>{if(ST.star[k]&&IDX.byId[k.replace(/#[ap]$/,'')])out.push(k);});
  const ranked=ST.rank.filter(k=>out.indexOf(k)>=0);
  const wOf=(k)=>{const u=unitLabel(k); return u?effW(u.it,u.role).v:null;};
  const rest=out.filter(k=>ranked.indexOf(k)<0)
    .sort((a,b)=>ORD.indexOf(wOf(a))-ORD.indexOf(wOf(b)));
  return ranked.concat(rest);
}
function move(arr,from,to){
  if(to<0||to>=arr.length) return arr;
  const x=arr.splice(from,1)[0]; arr.splice(to,0,x); return arr;
}
function prioBlock(){
  const c=el('div','card');
  c.appendChild(el('h3',null,ST.lang==='en'?'Priorities':'Prioritäten'));
  const units=starredUnits();
  if(!units.length){
    c.appendChild(el('div','hint',ST.lang==='en'
      ?'Nothing marked yet. Use the ★ button while rating — starred entries appear here and can be put in order.'
      :'Noch nichts markiert. Setze beim Bewerten den ★ — markierte Einträge erscheinen hier und lassen sich in eine Reihenfolge bringen.'));
    if(ST.mode==='e'&&!ST.showSt)
      c.appendChild(el('div','hint',ST.lang==='en'
        ?'The ★ button is hidden in getting-started mode — enable "Mark what matters most".'
        :'Der ★ ist im Einstiegsmodus ausgeblendet — aktiviere „Besonders wichtig markieren".'));
    return c;
  }
  c.appendChild(el('div','hint',ST.lang==='en'
    ?'Drag to reorder, or use the buttons. Order is optional; unordered stars count no less.'
    :'Zum Umsortieren ziehen oder die Tasten benutzen. Die Reihenfolge ist freiwillig; ungeordnete Sterne gelten nicht als unwichtiger.'));
  ST.rank=units.slice(); save();
  const ul=el('ul','ranklist');
  units.forEach((k,i)=>{
    const u=unitLabel(k); if(!u) return;
    const li=el('li','ranki'); li.draggable=true; li.dataset.k=k;
    li.appendChild(el('div','no',String(i+1)));
    const rt=el('div','rt');
    rt.appendChild(el('div',null,u.name+(u.roleName?' — '+u.roleName:'')));
    const e=effW(u.it,u.role);
    rt.appendChild(el('small',null,u.sec+' · '+(e.v?scLbl('wunsch',e.v):'—')+
      (e.src==='inh'?' ('+L(T.inherited)+')':'')));
    li.appendChild(rt);
    const mv=el('div','mv');
    [['⤒',0],['↑',i-1],['↓',i+1],['⤓',units.length-1]].forEach(([s,to])=>{
      const b=el('button','btn sm',s); b.type='button';
      b.onclick=()=>{move(ST.rank,i,to); save(); rerender();};
      mv.appendChild(b);
    });
    const rm=el('button','btn sm','★'); rm.type='button';
    rm.title=ST.lang==='en'?'remove star':'Stern entfernen';
    rm.onclick=()=>{delete ST.star[k];
      ST.rank=ST.rank.filter(x=>x!==k); save(); rerender();};
    mv.appendChild(rm);
    li.appendChild(mv);
    li.ondragstart=(ev)=>{ev.dataTransfer.setData('text/plain',k);li.classList.add('drag');};
    li.ondragend=()=>li.classList.remove('drag');
    li.ondragover=(ev)=>{ev.preventDefault();li.classList.add('over');};
    li.ondragleave=()=>li.classList.remove('over');
    li.ondrop=(ev)=>{ev.preventDefault();li.classList.remove('over');
      const src=ev.dataTransfer.getData('text/plain');
      const from=ST.rank.indexOf(src), to=ST.rank.indexOf(k);
      if(from>=0&&to>=0){move(ST.rank,from,to); save(); rerender();}};
    ul.appendChild(li);
  });
  c.appendChild(ul);
  return c;
}
function renderPrio(){
  const v=document.getElementById('vPrio'); v.innerHTML='';
  v.appendChild(prioBlock());
  /* Feinsortierung je Sektion */
  const c=el('div','card');
  c.appendChild(el('h3',null,ST.lang==='en'?'Fine ordering within a section':'Feinsortierung innerhalb einer Sektion'));
  const sel=el('select');
  sel.appendChild(el('option',null,'—'));
  THEMES.forEach(t=>t.sections.forEach(s=>{
    if(s.type!=='scale') return;
    const o=el('option',null,LB({de:s.title_de,en:s.title_en}));
    o.value=s.id; sel.appendChild(o);
  }));
  sel.value=ST.fineSec||'';
  const out=el('div');
  sel.onchange=()=>{ST.fineSec=sel.value; save(); rerender();};
  c.appendChild(sel); c.appendChild(out);
  if(ST.fineSec&&IDX.sec[ST.fineSec]){
    const s=IDX.sec[ST.fineSec];
    const buckets={};
    visItems(s).forEach(it=>it.units.forEach(u=>{
      const e=effW(it,u); if(!e.v||['neutral','na','hard','soft'].indexOf(e.v)>=0) return;
      (buckets[e.v]=buckets[e.v]||[]).push(it.id+u);
    }));
    ORD.forEach(b=>{
      if(!buckets[b]||buckets[b].length<2) return;
      const key=s.id+'|'+b;
      const cur=(ST.secRank[key]||[]).filter(k=>buckets[b].indexOf(k)>=0);
      const list=cur.concat(buckets[b].filter(k=>cur.indexOf(k)<0));
      ST.secRank[key]=list;
      out.appendChild(el('h5',null,scLbl('wunsch',b)));
      const ul=el('ul','ranklist');
      list.forEach((k,i)=>{
        const u=unitLabel(k); if(!u) return;
        const li=el('li','ranki');
        li.appendChild(el('div','no',String(i+1)));
        const rt=el('div','rt'); rt.appendChild(el('div',null,
          u.name+(u.roleName?' — '+u.roleName:''))); li.appendChild(rt);
        const mv=el('div','mv');
        [['↑',i-1],['↓',i+1]].forEach(([t2,to])=>{
          const b2=el('button','btn sm',t2); b2.type='button';
          b2.onclick=()=>{move(ST.secRank[key],i,to); save(); rerender();};
          mv.appendChild(b2);});
        li.appendChild(mv); ul.appendChild(li);
      });
      out.appendChild(ul);
    });
    if(!out.childNodes.length) out.appendChild(el('div','hint',ST.lang==='en'
      ?'Nothing to order here yet — at least two positive ratings in the same bucket are needed.'
      :'Hier gibt es noch nichts zu ordnen — es braucht mindestens zwei positive Bewertungen in derselben Stufe.'));
  }
  v.appendChild(c);
}

/* ==================== Auswertung ==================== */
function ratedUnits(){
  const out=[];
  IDX.items.forEach(it=>{
    if(it.kind!=='wunsch') return;
    it.units.forEach(u=>{
      const e=effW(it,u); if(!e.v) return;
      out.push({k:it.id+u,it:it,role:u,v:e.v,src:e.src,from:e.from,
        p:effP(it,u).v,f:effF(it).v,star:!!ST.star[it.id+u],
        rank:ST.rank.indexOf(it.id+u),x:ST.x[it.id+u]||''});
    });
  });
  return out;
}
function renderEval(){
  const v=document.getElementById('vEval'); v.innerHTML='';
  /* Im Einstieg ist die Bereichsantwort die vorgesehene Antwort, nicht eine
     Abkuerzung. Sie hier in 141 Einzelzeilen aufzufalten wuerde den Bogen
     genau dort wieder ueberfrachten, wo er kurz sein soll — und der Hinweis
     auf den „Anker" laese sich wie ein Vorwurf. Beides wird zusammengefasst. */
  const alle=ratedUnits();
  const ausKat=(r)=>r.src==='inh'&&r.from&&r.from.charAt(0)==='T'
    &&isEkat(IDX.theme[r.it.theme]);
  const R=ST.mode==='e'?alle.filter(r=>!ausKat(r)):alle;
  const kat=[];
  if(ST.mode==='e'){
    THEMES.filter(isEkat).forEach(t=>{
      ['','#a','#p'].forEach(u=>{
        const val=ST.nodeW['T:'+t.id+u];
        if(!val) return;
        kat.push({t:t,role:u,v:val,
          n:alle.filter(r=>r.it.theme===t.id&&r.role===(u||r.role)&&ausKat(r)).length});
      });
    });
  }
  const c=el('div','card');
  c.appendChild(el('h3',null,ST.lang==='en'?'Overview':'Auswertung'));
  const set=R.filter(r=>r.src==='set').length, inh=R.length-set;
  const pct=R.length?Math.round(100*set/R.length):0;
  c.appendChild(el('div','hint',R.length+(ST.lang==='en'?' rated entries: ':' bewertete Einträge: ')+
    set+(ST.lang==='en'?' set explicitly, ':' ausdrücklich gesetzt, ')+inh+
    (ST.lang==='en'?' inherited from a group or section.':' von einer Gruppe oder Sektion geerbt.')));
  /* Eine Gruppenbewertung, die nach unten durchschlaegt, ist ein Anker. Deshalb
     zeigen wir das Verhaeltnis, statt es zu verschweigen. */
  if(kat.length){
    const kc=el('div','egroup');
    kc.appendChild(el('h4',null,L(T.evalKat)+' ('+kat.length+')'));
    const kl=el('ul');
    kat.forEach(k=>{
      const li=el('li');
      li.appendChild(el('span',null,LB({de:k.t.title_de,en:k.t.title_en})+
        (k.role?' — '+LB(ROLE[k.role.slice(1)]):'')+' — '+scLbl('wunsch',k.v)));
      li.appendChild(el('small',null,' — '+L(T.evalKatGilt)+' '+k.n+' '+L(T.evalPunkte)));
      kl.appendChild(li);
    });
    kc.appendChild(kl); c.appendChild(kc);
    c.appendChild(el('div','hint',L(T.evalEinstieg)));
  }
  if(R.length&&ST.mode!=='e'){
    const bar=el('div','pbar'); bar.style.cssText='height:7px;max-width:420px;margin:7px 0 3px';
    const i1=el('i','set'); i1.style.width=pct+'%'; i1.style.position='relative';
    bar.appendChild(i1); c.appendChild(bar);
    c.appendChild(el('div','hint',pct+(ST.lang==='en'
      ?'\u2009% of your profile is your own explicit decision. A group rating carries downwards and is a strong anchor \u2014 the lower this share, the more of the profile comes from a handful of decisions.'
      :'\u2009% deines Profils sind eigene, ausdrückliche Entscheidungen. Eine Gruppenbewertung wirkt nach unten und ist ein starker Anker — je niedriger dieser Anteil, desto mehr des Profils stammt aus wenigen Klicks.')));
  }
  v.appendChild(c);
  ORD.forEach(b=>{
    const rows=R.filter(r=>r.v===b);
    if(!rows.length) return;
    rows.sort((a,b2)=>{
      const ra=a.rank<0?9999:a.rank, rb=b2.rank<0?9999:b2.rank;
      if(ra!==rb) return ra-rb;
      if(a.star!==b2.star) return a.star?-1:1;
      return a.it.de.localeCompare(b2.it.de);
    });
    const g=el('div','egroup');
    const h=el('h4',null,scLbl('wunsch',b)+' ('+rows.length+')');
    h.style.background='var(--c-'+b+')';
    if(b==='must')h.style.color='#1a1a1a';
    g.appendChild(h);
    const ul=el('ul');
    rows.forEach(r=>{
      const li=el('li');
      li.appendChild(el('span',null,(r.star?'★ ':'')+LB({de:r.it.de,en:r.it.en})+
        (r.role?' — '+LB(roleOf(r.it,r.role)):'')));
      const bits=[LB({de:IDX.sec[r.it.sec].title_de,en:IDX.sec[r.it.sec].title_en})];
      /* Die Vererbung kennt keinen Modus, die Liste schon: sonst stuende hier
         eine Bewertung, die man nirgends findet und nicht aendern kann. */
      if(!lvOK(r.it)) bits.push(L(T.ausserhalbModus));
      if(r.src==='inh') bits.push(L(T.inherited));
      if(r.p) bits.push(L(T.strafeAx)+': '+scLbl('strafe',r.p));
      if(r.f) bits.push(L(T.fantasy));
      if(r.x) bits.push(L(T.expAx)+': '+scLbl('erfahrung',r.x));
      if(r.it.risk) bits.push(ST.lang==='en'
        ?(r.it.risk==='hoch'?'high risk':'moderate risk'):'Risiko '+r.it.risk);
      li.appendChild(el('small',null,' — '+bits.join(' · ')));
      ul.appendChild(li);
    });
    g.appendChild(ul); v.appendChild(g);
  });
  /* Vereinbarungen */
  const ag=IDX.items.filter(it=>it.exempt&&it.units.some(u=>agOf(it,u)));
  if(ag.length){
    const g=el('div','egroup');
    g.appendChild(el('h4',null,ST.lang==='en'?'Framework and safety':'Rahmen und Sicherheit'));
    const ul=el('ul');
    ag.forEach(it=>{
      const li=el('li');
      li.appendChild(el('span',null,LB({de:it.de,en:it.en})));
      li.appendChild(el('small',null,' — '+it.units.map(u=>{const v=agOf(it,u);
        return v?((u?LB(roleOf(it,u))+': ':'')+scLbl(it.kind,v)):null;})
        .filter(Boolean).join(' · ')));
      ul.appendChild(li);
    });
    g.appendChild(ul); v.appendChild(g);
  }
}

/* ==================== Suche ==================== */
function doSearch(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(!q){ if(document.body.dataset.view==='search') setView(ST.prevView||'form'); return; }
  if(document.body.dataset.view!=='search'){ST.prevView=document.body.dataset.view; setView('search');}
  const v=document.getElementById('vSearch'); v.innerHTML='';
  const hits=IDX.items.filter(it=>lvOK(it)&&(
    (it.de||'').toLowerCase().indexOf(q)>=0||
    (it.en||'').toLowerCase().indexOf(q)>=0||
    (it.expl_de||'').toLowerCase().indexOf(q)>=0)).slice(0,300);
  const c=el('div','card');
  c.appendChild(el('h3',null,(ST.lang==='en'?'Search: ':'Suche: ')+hits.length+
    (hits.length>=300?'+':'')));
  v.appendChild(c);
  let lastSec=null, box=null;
  hits.forEach(it=>{
    if(it.sec!==lastSec){
      lastSec=it.sec; box=el('div','card');
      box.appendChild(el('h3',null,LB({de:IDX.sec[it.sec].title_de,en:IDX.sec[it.sec].title_en})));
      v.appendChild(box);
    }
    if(it.kind==='multi'||it.kind==='toys'){
      box.appendChild(el('div','hint',LB({de:it.de,en:it.en})));
    } else box.appendChild(itemRow(it));
  });
}

<script>

/* ====================================================================
   Vergleich zweier Profile  (SPEC § 9)

   ==================================================================== */
const CMP={a:null,b:null};          /* nur im Arbeitsspeicher, nie in ST */
const POS=['must','neigung','sehnsucht'], CUR=['interessant'],
      NEU=['neutral','na'], SOFT=['soft'], HARD=['hard'];
const inl=(a,v)=>a.indexOf(v)>=0;

/* Ids, auf die die Querverweise zugreifen */
const ID_LEITMODELL='risikomodell/nach-welchem-modell-arbeitest-du';

const WORT_KAT=['sprache-wortliste/sexistische-herabsetzung','sprache-wortliste/rassistische-oder-ethnisch-bezogene-herabsetzung','sprache-wortliste/herabsetzung-mit-bezug-auf-herkunft-oder-sprache','sprache-wortliste/koerper-und-gewichtsbezogene-herabsetzung','sprache-wortliste/behinderungs-oder-krankheitsbezogene-herabsetzung','sprache-wortliste/herabsetzung-mit-bezug-auf-gender-oder-orientierung','sprache-wortliste/herabsetzung-mit-bezug-auf-religion','sprache-wortliste/intelligenz-und-leistungsbezogene-herabsetzung','sprache-wortliste/sexuelle-herabsetzung'];

const MACHTABGABE=['grundorientierung/24-7-dynamik',
  'lifecoaching-accountability/dominante-begleitung-im-alltag-lifecoaching',
  'grundorientierung/total-power-exchange',
  'rollen-identitaeten/slave-als-rollenidentitaet',
  'rollen-identitaeten/property-besitzrolle','rollen-identitaeten/owner-eigentuemerrolle',
  'geld-findom/financial-domination-findom-mit-festem-budget','geld-findom/paypig-rollenspiel'];

/* ---------- Zugriff auf ein geladenes Profil ---------- */
const ansOf=(P,id)=>(P&&P.answers&&P.answers[id])||null;
function rOf(P,id,role){
  const a=ansOf(P,id); if(!a||!a.roles) return null;
  return a.roles[role]||null;
}
function valOf(P,id,role){
  const a=ansOf(P,id); if(!a) return null;
  if(a.roles){
    if(role&&a.roles[role]) return a.roles[role].value||null;
    if(!role){ const k=Object.keys(a.roles)[0]; return k?(a.roles[k].value||null):null; }
    return (a.roles['-']&&a.roles['-'].value)||null;
  }
  return a.value||null;
}
const txtOf=(P,id)=>{const a=ansOf(P,id); return a?(a.text||''):'';};
const nameOf=(P)=>(P&&P.meta&&P.meta.alias)||'—';
const unitsFor=(it)=>it.ap?['a','p']:['-'];
/* Auch im Vergleich gilt die Bezeichnung des Items, nicht die Vorgabe —
   sonst stuende bei „Knien" weiter „ausfuehrend", wo der Bogen selbst
   „kniet selbst" sagt. */
const roleTxt=(u,it)=>u==='a'||u==='p'?LB(roleOf(it,'#'+u)):'';
const src=(r)=>r&&r.rating_src==='inh'?' ('+(ST.lang==='en'?'derived':'abgeleitet')+')':'';
const itName=(it)=>LB({de:it.de,en:it.en});
const secName=(it)=>LB({de:IDX.sec[it.sec].title_de,en:IDX.sec[it.sec].title_en});
function sharedNote(P,id){const a=ansOf(P,id);
  return (a&&a.note&&a.note.shared&&a.note.text)?a.note.text.replace(/\n/g,' '):'';}

/* ---------- Bericht aufbauen ---------- */
function buildReport(A,B){
  const nA=nameOf(A), nB=nameOf(B), S=[];
  const push=(id,title,note,rows,empty)=>S.push({id:id,title:title,note:note,
    rows:rows,empty:empty||null});

  /* 0 — Abdeckung */
  const cov=(P)=>{const c=P.coverage||{};
    return (c.items_in_mode||0)+' von '+(c.items_total||IDX.items.length)+
      ' Punkten abgefragt ('+LB(MODELBL[P.mode||'v'])+')';};
  const covRows=[{t:nA+': '+cov(A),tone:'info'},{t:nB+': '+cov(B),tone:'info'}];
  /* Fassungsunterschiede offenlegen, statt sie als fehlende Antworten auszugeben */
  [[A,nA],[B,nB]].forEach(([P,n])=>{
    const rev=(P.app&&P.app.listRevision)||null;
    const fremd=Object.keys(P.answers||{}).filter(id=>!IDX.byId[id]);
    const bits=[];
    if(rev&&rev!==APP.listRev) bits.push((ST.lang==='en'?'filled in against list revision '
      :'mit Listenfassung ')+rev+(ST.lang==='en'?', current is ':' ausgefüllt, aktuell ist ')+APP.listRev);
    if(fremd.length) bits.push(fremd.length+(ST.lang==='en'
      ?' answers refer to items this version does not have'
      :' Angaben beziehen sich auf Punkte, die es in dieser Fassung nicht gibt'));
    if(!bits.length) return;
    covRows.push({t:n+': '+(ST.lang==='en'?'different version':'abweichende Fassung'),
      s:bits.join(' · ')+'\n'+(ST.lang==='en'
        ?'Unanswered items can therefore also mean the item did not exist in that version.'
        :'„Nicht bewertet" kann hier also auch heißen, dass es den Punkt in jener Fassung noch nicht gab.'),
      tone:'warn'});
  });
  push('abdeckung',ST.lang==='en'?'Coverage':'Abdeckung',
    ST.lang==='en'
      ?'What was not asked is **open, not refused**. Do not read a gap as a no.'
      :'Was nicht abgefragt wurde, ist **offen, nicht abgelehnt**. Eine Lücke ist kein Nein.',
    covRows);

  /* 1 — Absolute No-Gos */
  const nogo=[];
  IDX.items.forEach(it=>{
    if(it.kind!=='wunsch') return;
    unitsFor(it).forEach(u=>{
      const a=rOf(A,it.id,u), b=rOf(B,it.id,u);
      const aH=a&&a.rating==='hard', bH=b&&b.rating==='hard';
      if(!aH&&!bH) return;
      const who=aH&&bH?(nA+' + '+nB):(aH?nA:nB);
      nogo.push({t:itName(it)+(u!=='-'?' — '+roleTxt(u,it):''),
        s:secName(it)+' · '+who+(aH?src(a):'')+(bH?src(b):''),tone:'no',
        sort:[it.theme,it.sec,it.de]});
    });
  });
  const worte=[]; [A,B].forEach((P,i)=>{splitWords(txtOf(P,ID_WORTE_NEIN))
    .forEach(w=>worte.push({w:w,who:i?nB:nA}));});
  worte.forEach(x=>nogo.push({t:'Wort: „'+x.w+'"',s:'ausgeschlossen von '+x.who,tone:'no',
    sort:['zzz','wort',x.w]}));
  nogo.sort((x,y)=>x.sort.join('|').localeCompare(y.sort.join('|')));
  push('nogo',ST.lang==='en'?'Absolute no-gos':'Absolute No-Gos',
    ST.lang==='en'?'The union of both sides. One hard limit is enough — it is not negotiable.'
      :'Die Vereinigung beider Seiten. Ein Hard Limit genügt — es steht nicht zur Verhandlung.',
    nogo, ST.lang==='en'?'None stated.':'Keine angegeben.');

  /* 2 — Unvereinbare Vereinbarungen */
  const ver=[];
  function vergleicheVereinbarung(it,ua,ub){
    const a=valOf(A,it.id,ua), b=valOf(B,it.id,ub);
    if(!a&&!b) return;
    const rolle=(ua!=='-')?' — '+nA+' '+roleTxt(ua,it)+' / '+nB+' '+roleTxt(ub,it):'';
    const name=itName(it)+rolle;
    const paar=(x,y)=>(a===x&&b===y)||(b===x&&a===y);
    const beide=nA+': '+(a?scLbl('vereinbarung',a):'—')+' · '+nB+': '+(b?scLbl('vereinbarung',b):'—');
    if(paar('verbindlich','ablehnend'))
      ver.push({t:name,s:beide+' — '+(ST.lang==='en'
        ?'a condition on one side against an express wish for the opposite on the other'
        :'Bedingung der einen Seite gegen den ausdrücklichen Gegenwillen der anderen'),tone:'no'});
    else if(paar('verbindlich','nicht-noetig'))
      ver.push({t:name,s:beide+' — '+(ST.lang==='en'
        ?'no contradiction in substance: one needs it, the other does not mind. Worth saying out loud.'
        :'kein Widerspruch in der Sache: die eine Seite braucht es, die andere hat nichts dagegen. Gehört trotzdem ausgesprochen.'),
        tone:'warn'});
    else if(paar('gewuenscht','ablehnend'))
      ver.push({t:name,s:beide,tone:'warn'});
    else if(a==='verbindlich'&&!b)
      ver.push({t:name,s:nA+' verbindlich · '+nB+' nicht beantwortet',tone:'warn'});
    else if(b==='verbindlich'&&!a)
      ver.push({t:name,s:nB+' verbindlich · '+nA+' nicht beantwortet',tone:'warn'});
  }
  IDX.items.forEach(it=>{
    if(!it.exempt||it.kind!=='vereinbarung') return;
    /* Ueber Kreuz: was die eine Seite als fuehrende zusichert, trifft auf das,
       was die andere als folgende braucht. */
    (it.ap?[['a','p'],['p','a']]:[['-','-']]).forEach(pr=>
      vergleicheVereinbarung(it,pr[0],pr[1]));
  });

  push('vereinbarungen',ST.lang==='en'?'Incompatible agreements':'Unvereinbare Vereinbarungen',
    ST.lang==='en'?'A binding condition on one side against a refusal on the other.'
      :'Eine verbindliche Bedingung der einen Seite gegen eine Ablehnung der anderen.',
    ver, ST.lang==='en'?'No contradictions found.':'Keine Widersprüche gefunden.');

  /* 3 — Risikomodell */
  const la=valOf(A,ID_LEITMODELL), lb=valOf(B,ID_LEITMODELL), risk=[];
  if(la||lb){
    const same=la&&lb&&la===lb;
    risk.push({t:nA+': '+(la?scLbl('leitmodell',la):'—')+'   ·   '+
      nB+': '+(lb?scLbl('leitmodell',lb):'—'),
      s:same?(ST.lang==='en'?'Same model.':'Gleiches Modell.')
        :(ST.lang==='en'?'Different risk stance — settle this before negotiating any high-risk practice.'
          :'Unterschiedliche Risikohaltung — vor jeder Hochrisiko-Praktik klären.'),
      tone:same?'ok':'warn'});
  }
  push('risikomodell',ST.lang==='en'?'Risk model':'Risikomodell',null,risk,
    ST.lang==='en'?'Not stated on either side.':'Von beiden Seiten nicht angegeben.');

  /* 4 — Zuerst zu besprechen: reale Abhaengigkeit + starke Machtabgabe */
  const first=[];
  [[A,nA],[B,nB]].forEach(([P,n])=>{
    const mh=[];
    MACHTABGABE.forEach(id=>{const it=IDX.byId[id]; if(!it) return;
      unitsFor(it).forEach(u=>{const r=rOf(P,id,u);
        if(r&&r.rating==='must') mh.push(itName(it)+(u!=='-'?' ('+roleTxt(u,it)+')':''));});});
    if(!mh.length) return;
    const offen=ABSICHERUNG.filter(id=>{
      const v=valOf(P,id); return !v||v==='ablehnend'||v==='nicht-noetig';
    }).map(id=>{const v=valOf(P,id); const nm=IDX.byId[id]?itName(IDX.byId[id]):id;
      return nm+(v?' ('+scLbl('vereinbarung',v)+')':'');});
    if(!offen.length) return;
    first.push({t:n+(ST.lang==='en'?': far-reaching power exchange without settled safeguards'
        :': weitreichende Machtabgabe ohne gesicherte Absicherung'),
      s:(ST.lang==='en'?'As must-have: ':'Als Must-have: ')+mh.join(', ')+
        '\n'+(ST.lang==='en'
          ?'A lasting transfer of power is only as revocable as the way out remains materially open. Settle these before any agreement.'
          :'Eine dauerhafte Machtabgabe ist nur so widerruflich, wie der Weg hinaus materiell offen bleibt. Vor einer Vereinbarung klären.')+
        '\n'+(ST.lang==='en'?'Open or declined: ':'Offen oder abgelehnt: ')+offen.join(', '),
      tone:'warn'});
  });
  /* 4b — gesundheitsbezogene Kontrolle ohne beantwortete Grenzen */
  (function(){
    const wollen=[];
    [[A,nA],[B,nB]].forEach(([P,n])=>{
      GESUND_KONTROLLE.forEach(id=>{
        const it=IDX.byId[id]; if(!it) return;
        unitsFor(it).forEach(u=>{
          const r=rOf(P,id,u);
          if(r&&(r.rating==='must'||r.rating==='neigung'))
            wollen.push(n+': '+itName(it)+(u!=='-'?' ('+roleTxt(u,it)+')':'')+
              ' — '+scLbl('wunsch',r.rating));
        });
      });
    });
    if(!wollen.length) return;
    const offen=[];
    GESUND_GRENZEN.forEach(id=>{
      const it=IDX.byId[id]; if(!it) return;
      const fehlt=[[A,nA],[B,nB]].filter(([P])=>!valOf(P,id)).map(([,n])=>n);
      if(fehlt.length) offen.push(itName(it)+' ('+fehlt.join(', ')+')');
    });
    if(!offen.length) return;
    first.push({t:ST.lang==='en'?'Health-related control without settled limits'
        :'Gesundheitsbezogene Kontrolle ohne beantwortete Grenzen',
      s:wollen.join('\n')+'\n'+(ST.lang==='en'
        ?'Health-related control works slowly and is hard to see from outside. Settle the counterparts in Framework and safety before this starts.'
        :'Gesundheitsbezogene Kontrolle wirkt langsam und ist von außen schwer zu erkennen. Die Gegenstücke in Rahmen und Sicherheit klären, bevor das beginnt.')+
        '\n'+(ST.lang==='en'?'Still open: ':'Noch offen: ')+offen.join(', '),
      tone:'warn'});
  })();

  push('zuerst',ST.lang==='en'?'To discuss first':'Zuerst zu besprechen',null,first,
    ST.lang==='en'?'No such combination found.':'Keine solche Kombination gefunden.');

  /* 5 — Nutzbare Sprache */
  const lang=[];
  const noAll=[].concat(splitWords(txtOf(A,ID_WORTE_NEIN)),splitWords(txtOf(B,ID_WORTE_NEIN)))
    .map(w=>w.toLowerCase());
  const frei=(w)=>noAll.indexOf(w.toLowerCase())<0;
  const lc=(w)=>w.toLowerCase();
  const inList=(l,w)=>l.some(x=>lc(x)===lc(w));
  const gutA=splitWords(txtOf(A,ID_ANREDE_GUT)), gutB=splitWords(txtOf(B,ID_ANREDE_GUT));
  const herA=splitWords(txtOf(A,ID_ANREDE_HERAB)), herB=splitWords(txtOf(B,ID_ANREDE_HERAB));
  function blockListe(la,lb,titel,hinweis){
    if(!la.length&&!lb.length) return;
    const both=la.filter(w=>inList(lb,w)).filter(frei);
    lang.push({t:titel+': '+(both.length?both.join(', ')
      :(ST.lang==='en'?'nothing on both lists':'nichts auf beiden Listen')),
      s:hinweis, tone:both.length?'ok':'warn'});
    const onlyA=la.filter(frei).filter(w=>!inList(lb,w));
    const onlyB=lb.filter(frei).filter(w=>!inList(la,w));
    if(onlyA.length) lang.push({t:(ST.lang==='en'?'Only ':'Nur ')+nA+': '+onlyA.join(', '),
      s:ST.lang==='en'?'not released by the other side':'von der anderen Seite nicht freigegeben',tone:'warn'});
    if(onlyB.length) lang.push({t:(ST.lang==='en'?'Only ':'Nur ')+nB+': '+onlyB.join(', '),
      s:ST.lang==='en'?'not released by the other side':'von der anderen Seite nicht freigegeben',tone:'warn'});
  }
  blockListe(gutA,gutB,ST.lang==='en'?'Rewarding, usable':'Belohnend, nutzbar',
    ST.lang==='en'?'Words both sides released as praise.'
      :'Worte, die beide Seiten als Lob freigegeben haben.');
  blockListe(herA,herB,ST.lang==='en'?'Degrading, usable':'Herabsetzend, nutzbar',
    ST.lang==='en'?'Words both sides released as an insult.'
      :'Worte, die beide Seiten als Beschimpfung freigegeben haben.');
  /* Derselbe Klang, entgegengesetzte Bedeutung. Der Befund, den eine einzige
     gemeinsame Wortliste nicht hergeben konnte. */
  const konflikt=[];
  gutA.filter(frei).forEach(w=>{ if(inList(herB,w))
    konflikt.push({w:w,lob:nA,schimpf:nB}); });
  gutB.filter(frei).forEach(w=>{ if(inList(herA,w))
    konflikt.push({w:w,lob:nB,schimpf:nA}); });
  konflikt.forEach(k=>lang.push({t:(ST.lang==='en'?'Conflicting meaning: „'
      :'Bedeutungskonflikt: „')+k.w+'"',
    s:k.lob+(ST.lang==='en'?' released it as praise, ':' hat es als Lob freigegeben, ')+
      k.schimpf+(ST.lang==='en'?' as an insult. The same word lands in opposite ways — settle it before it is used.'
        :' als Beschimpfung. Dasselbe Wort kommt gegenteilig an — vor dem Gebrauch klären.'),
    tone:'no'}));
  WORT_KAT.forEach(id=>{
    const it=IDX.byId[id]; if(!it) return;
    const a=valOf(A,id), b=valOf(B,id); if(!a&&!b) return;
    const ia=a?KAT_ORD.indexOf(a):0, ib=b?KAT_ORD.indexOf(b):0;
    const eff=KAT_ORD[Math.min(ia<0?0:ia, ib<0?0:ib)];
    lang.push({t:itName(it)+': '+scLbl('herabsetzung',eff),
      s:nA+': '+(a?scLbl('herabsetzung',a):'—')+' · '+nB+': '+(b?scLbl('herabsetzung',b):'—')+
        (a!==b?' — '+(ST.lang==='en'?'the more restrictive answer applies'
          :'es gilt die restriktivere Angabe'):''),
      tone:eff==='nie'?'no':(a!==b?'warn':'ok')});
  });
  push('sprache',ST.lang==='en'?'Usable language':'Nutzbare Sprache',
    ST.lang==='en'?'Word lists are intersected, categories take the stricter side.'
      :'Wortlisten werden geschnitten, bei Kategorien gilt die strengere Seite.',
    lang, ST.lang==='en'?'No word lists filled in.':'Keine Wortlisten ausgefüllt.');

  /* 6 — Strafe */
  const str=[];
  IDX.items.forEach(it=>{
    if(it.kind!=='wunsch'||!it.ap) return;
    [[A,nA,B,nB],[B,nB,A,nA]].forEach(([P,pn,Q,qn])=>{
      const rec=rOf(P,it.id,'p'), giv=rOf(Q,it.id,'a');
      const rp=rec&&rec.punishment, gp=giv&&giv.punishment;
      if(!rp&&!gp) return;
      if(rec&&rec.rating==='hard') return;               /* steht schon unter No-Go */
      if(rp==='echt'&&gp==='echt')
        str.push({t:itName(it),s:pn+' '+(ST.lang==='en'?'receives':'empfängt')+' · '+qn+' '+
          (ST.lang==='en'?'administers':'verhängt')+' — '+
          (ST.lang==='en'?'effective consequence, carried by both':'wirksame Konsequenz, beidseitig getragen'),
          tone:'ok'});
      else if(rp==='reizvoll'&&gp==='echt')
        str.push({t:itName(it),s:qn+' '+(ST.lang==='en'?'means this as a real punishment, '
          :'meint das als echte Strafe, ')+pn+(ST.lang==='en'
          ?' finds it arousing — it does not deter.':' findet es reizvoll — es wirkt nicht abschreckend.'),
          tone:'warn'});
      else if(rp==='echt'&&!gp)
        str.push({t:itName(it),s:pn+(ST.lang==='en'?' allows this as a real punishment; '
          :' erlaubt das als echte Strafe; ')+qn+(ST.lang==='en'
          ?' has not said they are willing to administer it.':' hat keine Bereitschaft angegeben, sie zu verhängen.'),
          tone:'warn'});
    });
  });
  push('strafe',ST.lang==='en'?'Punishment':'Strafe',
    ST.lang==='en'?'A punishment that arouses is not a punishment.'
      :'Eine Strafe, die erregt, ist keine Strafe.',
    str, ST.lang==='en'?'Nothing recorded on the punishment axis.':'Auf der Strafe-Achse nichts angegeben.');

  /* 7 — Prioritaeten-Abgleich */
  const prio=[];
  [[A,nA,B,nB],[B,nB,A,nA]].forEach(([P,pn,Q,qn])=>{
    (P.priorities||[]).forEach((k,i)=>{
      const role=/#[ap]$/.test(k)?k.slice(-2,-1)==='a'?'a':'p':'-';
      const id=/#[ap]$/.test(k)?k.slice(0,-2):k;
      const it=IDX.byId[id]; if(!it) return;
      const opp=role==='a'?'p':role==='p'?'a':'-';
      const q=rOf(Q,id,opp);
      const qv=q&&q.rating;
      let tone='info',txt;
      if(!qv) txt=qn+(ST.lang==='en'?' has not rated this — open, not refused.'
        :' hat das nicht bewertet — offen, nicht abgelehnt.'),tone='warn';
      else if(qv==='hard') txt=qn+(ST.lang==='en'?': hard limit — a core wish meets a no-go.'
        :': Hard Limit — ein Kernwunsch trifft auf ein No-Go.'),tone='no';
      else if(qv==='soft') txt=qn+(ST.lang==='en'?': soft limit — the most important thing to negotiate.'
        :': Soft Limit — der wichtigste Verhandlungspunkt.'),tone='warn';
      else if(inl(POS,qv)) txt=qn+': '+scLbl('wunsch',qv)+src(q)+
        (ST.lang==='en'?' — strong match.':' — starker Treffer.'),tone='ok';
      else txt=qn+': '+scLbl('wunsch',qv)+src(q);
      prio.push({t:'#'+(i+1)+' '+pn+': '+itName(it)+(role!=='-'?' ('+roleTxt(role,it)+')':''),
        s:txt,tone:tone,ord:i});
    });
  });
  prio.sort((x,y)=>({no:0,warn:1,ok:2,info:3}[x.tone]-{no:0,warn:1,ok:2,info:3}[y.tone])||x.ord-y.ord);
  push('prioritaeten',ST.lang==='en'?'Priorities':'Prioritäten-Abgleich',
    ST.lang==='en'?'Ranks are **not** offset against each other. There is no compatibility score.'
      :'Ränge werden **nicht** miteinander verrechnet. Es gibt keine Passungskennzahl.',
    prio, ST.lang==='en'?'No priorities set on either side.':'Auf beiden Seiten keine Prioritäten gesetzt.');

  /* 8–11 — Wunsch-Matching */
  const match=[],entdecken=[],einseitig=[],verhandeln=[],fantasie=[];
  const rank=(v)=>ORD.indexOf(v);
  IDX.items.forEach(it=>{
    if(it.kind!=='wunsch') return;
    const fa=(ansOf(A,it.id)||{}).fantasy_only, fb=(ansOf(B,it.id)||{}).fantasy_only;
    const pairs=it.ap?[['a','p',A,nA,B,nB],['p','a',A,nA,B,nB]]:[['-','-',A,nA,B,nB]];
    pairs.forEach(([ua,ub,PA,pn,PB,qn])=>{
      const a=rOf(PA,it.id,ua), b=rOf(PB,it.id,ub);
      const av=a&&a.rating, bv=b&&b.rating;
      if(av==='hard'||bv==='hard') return;               /* No-Go steht oben */
      const dir=it.ap?(ua==='a'?pn+' → '+qn:qn+' → '+pn):pn+' + '+qn;
      const base={t:itName(it)+(it.ap?' — '+dir:''),
        s:secName(it)+' · '+pn+': '+(av?scLbl('wunsch',av)+src(a):'—')+
          ' · '+qn+': '+(bv?scLbl('wunsch',bv)+src(b):'—'),
        ord:Math.min(rank(av)<0?99:rank(av),rank(bv)<0?99:rank(bv))};
      const note=[sharedNote(A,it.id),sharedNote(B,it.id)].filter(Boolean).join(' / ');
      if(note) base.s+=' · '+note;
      if(fa||fb){ fantasie.push(Object.assign({tone:'info'},base,
        {s:base.s+' · '+(ST.lang==='en'?'fantasy only — talk, do not enact'
          :'nur Fantasie — darüber reden, nicht umsetzen')})); return; }
      if(inl(POS,av)&&inl(POS,bv)) match.push(Object.assign({tone:'ok'},base));
      else if(inl(CUR,av)&&inl(CUR,bv)){
        const noExp=(a&&a.experience==='keine')&&(b&&b.experience==='keine');
        entdecken.push(Object.assign({tone:'ok'},base,
          {s:base.s+(noExp?' · '+(ST.lang==='en'?'neither has experience'
            :'beide ohne Erfahrung'):'')}));
      }
      else if((inl(SOFT,av)&&(inl(POS,bv)||inl(CUR,bv)))||
              (inl(SOFT,bv)&&(inl(POS,av)||inl(CUR,av))))
        verhandeln.push(Object.assign({tone:'warn'},base));
      else if(av==='must'&&(!bv||inl(NEU,bv)))
        einseitig.push(Object.assign({tone:'warn'},base,
          {s:base.s+' · '+(bv?'':(ST.lang==='en'?'not rated — open, not refused'
            :'nicht bewertet — offen, nicht abgelehnt'))}));
      else if(bv==='must'&&(!av||inl(NEU,av)))
        einseitig.push(Object.assign({tone:'warn'},base,
          {s:base.s+' · '+(av?'':(ST.lang==='en'?'not rated — open, not refused'
            :'nicht bewertet — offen, nicht abgelehnt'))}));
    });
  });
  [match,entdecken,verhandeln,einseitig,fantasie].forEach(a=>a.sort((x,y)=>x.ord-y.ord));
  push('match',ST.lang==='en'?'Matches':'Treffer',
    ST.lang==='en'?'Sorted by how strongly both sides want it. A match is a conversation opener, not permission.'
      :'Sortiert danach, wie stark beide es wollen. Ein Treffer ist ein Gesprächsanlass, keine Erlaubnis.',
    match, ST.lang==='en'?'No overlap found.':'Keine Überschneidung gefunden.');
  push('einseitig',ST.lang==='en'?'One-sided core wishes':'Einseitige Kernwünsche',
    ST.lang==='en'?'A must-have on one side that the other has not answered positively.'
      :'Ein Must-have der einen Seite, das die andere nicht positiv beantwortet hat.',
    einseitig, ST.lang==='en'?'None.':'Keine.');
  push('verhandeln',ST.lang==='en'?'To negotiate':'Verhandeln',
    ST.lang==='en'?'A soft limit against interest on the other side.'
      :'Ein Soft Limit gegen Interesse der anderen Seite.',
    verhandeln, ST.lang==='en'?'None.':'Keine.');
  push('entdecken',ST.lang==='en'?'Explore together':'Gemeinsam entdecken',
    null, entdecken, ST.lang==='en'?'None.':'Keine.');
  push('fantasie',ST.lang==='en'?'Fantasy only — do not enact':'Nur Fantasie, nicht umsetzen',
    null, fantasie, ST.lang==='en'?'None.':'Keine.');

  /* 12 — Aftercare */
  const after=[];
  (IDX.sec['aftercare']?IDX.sec['aftercare'].items:[]).forEach(it=>{
    unitsFor(it).forEach(u=>{
      const opp=u==='a'?'p':u==='p'?'a':'-';
      const a=rOf(A,it.id,u), b=rOf(B,it.id,opp);
      if(!a&&!b) return;
      const av=a&&a.rating, bv=b&&b.rating;
      if(!inl(POS,av)&&!inl(POS,bv)) return;
      after.push({t:itName(it)+(u!=='-'?' — '+roleTxt(u,it):''),
        s:nA+': '+(av?scLbl('wunsch',av):'—')+' · '+nB+': '+(bv?scLbl('wunsch',bv):'—'),
        tone:(inl(POS,av)&&inl(POS,bv))?'ok':'warn'});
    });
  });
  push('aftercare',ST.lang==='en'?'Aftercare':'Aftercare-Abgleich',null,after,
    ST.lang==='en'?'Nothing rated.':'Nichts bewertet.');

  /* 13 — Offen */
  const offenRows=[];
  let bothOpen=0;
  IDX.items.forEach(it=>{
    if(it.kind!=='wunsch') return;
    unitsFor(it).forEach(u=>{
      if(!rOf(A,it.id,u)&&!rOf(B,it.id,u)) bothOpen++;
    });
  });
  offenRows.push({t:bothOpen+(ST.lang==='en'?' units rated by neither side.'
    :' Einheiten von keiner Seite bewertet.'),
    s:ST.lang==='en'?'Open, not refused.':'Offen, nicht abgelehnt.',tone:'info'});
  push('offen',ST.lang==='en'?'Still open':'Offen',null,offenRows);
  return {a:A,b:B,nA:nA,nB:nB,sections:S};
}
function splitWords(t){
  return String(t||'').split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
}

<script>
"use strict";
/* ==================== Vergleich: Laden, Anzeige, Export ==================== */
function parseProfile(txt){
  let obj=null;
  const m=String(txt).match(/```kinkcompass\s*\n?([\s\S]*?)```/);
  if(m){ try{obj=JSON.parse(m[1].trim());}catch(e){} }
  if(!obj){ try{obj=JSON.parse(txt);}catch(e){} }
  if(!obj) return null;
  if(!obj.answers&&obj.state){ obj.answers={}; }
  return obj.answers?obj:null;
}
function loadProfile(slot,input){

  };

}
function useOwn(slot){ CMP[slot]=JSON.parse(JSON.stringify(bundle())); renderCmp(); }

const TONE={no:'var(--c-hard)',warn:'var(--c-soft)',ok:'var(--c-neigung)',info:'var(--line)'};
const MARK={no:'⛔',warn:'⚠️',ok:'✅',info:'·'};

      {no:0,warn:1,ok:2,info:3}[m]?r.tone:m),'info');
    h.style.background=TONE[worst]; if(worst==='info')h.style.color='var(--txt)';

  S.push('> '+(en?'Ranks are not offset against each other and there is no compatibility score — on purpose.'
    :'Ränge werden nicht verrechnet und es gibt keine Passungskennzahl — mit Absicht.'),'');
  rep.sections.forEach((s,i)=>{
    S.push('## '+(i)+'. '+s.title,'');
    if(s.note) S.push(s.note,'');
    if(!s.rows.length){ S.push('*'+(s.empty||'—')+'*',''); return; }
    s.rows.forEach(r=>{
      S.push('- '+MARK[r.tone]+' **'+r.t+'**');
      if(r.s) r.s.split('\n').forEach(line=>S.push('  ' +line));
    });
    S.push('');
  });
  S.push('---','',(en?'Generated by ':'Erzeugt mit ')+APP.name+' '+APP.version+
    ' · '+(en?'entirely locally, no data left either device.'
    :'vollständig lokal, keine Daten haben ein Gerät verlassen.'),'');
  dl('kinkcompass_vergleich_'+stamp()+'.md',S.join('\n'),'text/markdown');
}

<script>
"use strict";
/* ==================== Export / Import ==================== */
function dl(name,text,mime){
  const b=new Blob([text],{type:mime+';charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},0);
}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());}

/* Eine Bewertung, die nur auf dem Themenknoten liegt, kommt in keiner
   Item-Tabelle vor — sie wuerde im Export lautlos verschwinden. */
function ekatAnswers(t){
  if(!isEkat(t)) return [];
  const out=[];
  ['','#a','#p'].forEach(u=>{
    const v=ST.nodeW['T:'+t.id+u];
    if(v) out.push({role:u,v:v});
  });
  return out;
}

function snapshot(){
  /* aufgeloeste Antworten, maschinenlesbar */
  const out={};
  IDX.items.forEach(it=>{
    let o=null;
    if(it.kind==='wunsch'){
      const units={};
      it.units.forEach(u=>{
        const w=effW(it,u), p=effP(it,u);
        if(!w.v&&!p.v&&!ST.x[it.id+u]&&!ST.star[it.id+u]) return;
        units[u?u.slice(1):'-']={rating:w.v||null,rating_src:w.src||null,
          punishment:p.v||null,punishment_src:p.src||null,
          experience:ST.x[it.id+u]||null,star:!!ST.star[it.id+u],
          rank:ST.rank.indexOf(it.id+u)>=0?ST.rank.indexOf(it.id+u)+1:null};
      });
      const f=effF(it);
      if(Object.keys(units).length||f.v) o={roles:units,fantasy_only:!!f.v,
        fantasy_src:f.src||null,skipped:isSkipped(it)};
    } else if(it.kind==='text'){ if((ST.tx[it.id]||'').trim()) o={text:ST.tx[it.id]}; }
    else if(it.kind==='multi'){ if((ST.multi[it.sec]||[]).indexOf(it.id)>=0) o={selected:true}; }
    else {
      const roles={};
      it.units.forEach(u=>{const v=agOf(it,u); if(v) roles[u?u.slice(1):'-']={value:v};});
      if(Object.keys(roles).length) o={roles:roles,scale:it.kind};
    }
    if(o){
      const n=ST.notes[it.id];
      if(n&&n.t) o.note={text:n.t,shared:!!n.sh};
      o.level=it.level; o.section=it.sec; o.theme=it.theme;
      if(it.risk) o.risk=it.risk;
      out[it.id]=o;
    }
  });
  return out;
}
function bundle(){
  const vis=IDX.items.filter(lvOK);
  const c=countUnits(vis.filter(it=>!it.exempt)), cs=countUnits(vis.filter(it=>it.exempt));
  return {schema:'kinkcompass',schemaVersion:APP.schema,
    app:{name:APP.name,version:APP.version,scaleRevision:APP.scaleRev,listRevision:APP.listRev},
    exported:new Date().toISOString(),
    mode:ST.mode,lang:ST.lang,
    coverage:{mode:ST.mode,items_total:IDX.items.length,items_in_mode:vis.length,
      kink:{set:c.set,resolved:c.clar,total:c.tot},
      framework:{set:cs.set,resolved:cs.clar,total:cs.tot}},
    scales:{wunsch:SC.wunsch.map(s=>({value:s.v,label_de:s.de,label_en:s.en,desc_de:s.dde})),
      strafe:SC.strafe.map(s=>({value:s.v,label_de:s.de,label_en:s.en,desc_de:s.dde})),
      erfahrung:SC.erfahrung,vereinbarung:SC.vereinbarung,angabe:SC.angabe,
      choices:DATA.tree.choices},
    roles:{a:'top',p:'bottom'},
    meta:ST.meta, priorities:ST.rank.slice(),
    orphans:ST.orphans&&Object.keys(ST.orphans).length?ST.orphans:undefined,
    answers:snapshot(), toys:ST.toys.filter(t=>t&&t.trim()),
    state:ST};
}
function exportJSON(){
  dl('kinkcompass_'+stamp()+'.json',JSON.stringify(bundle(),null,1),'application/json');
}
function exportMD(){
  const m=ST.meta,S=[];
  S.push('# KinkCompass — Neigungs- und Grenzenliste','');
  S.push('<!-- '+APP.name+' '+APP.version+' · Schema '+APP.schema+' · Skala '+APP.scaleRev+
    ' · Liste '+APP.listRev+' · exportiert '+new Date().toISOString()+' -->','');
  const head=[m.alias?'**'+m.alias+'**':'',m.date||'',m.self||'',m.version||''].filter(Boolean);
  if(head.length) S.push(head.join(' · '),'');
  if(m.note) S.push('> '+String(m.note).replace(/\n/g,'\n> '),'');
  const vis=IDX.items.filter(lvOK);
  const c=countUnits(vis.filter(it=>!it.exempt)), cs=countUnits(vis.filter(it=>it.exempt));
  S.push('Umfang: **'+LB(MODELBL[ST.mode])+'** — '+vis.length+' von '+IDX.items.length+
    ' Punkten abgefragt. Nicht abgefragte Punkte sind **offen, nicht abgelehnt**.','');
  S.push('Neigungen: '+c.set+' ausdrücklich bewertet, '+c.clar+' geklärt von '+c.tot+
    ' · Rahmen und Sicherheit: '+cs.set+' von '+cs.tot,'');
  S.push('Ein Treffer in einem Vergleich ist ein **Gesprächsanlass, keine Erlaubnis**.','');

  /* Prioritaeten zuerst */
  const units=starredUnits();
  if(units.length){
    S.push('## Prioritäten','');
    units.forEach((k,i)=>{
      const u=unitLabel(k); if(!u) return;
      const e=effW(u.it,u.role);
      S.push((i+1)+'. '+u.name+(u.roleName?' *('+u.roleName+')*':'')+
        ' — '+(e.v?scLbl('wunsch',e.v):'—')+' · '+u.sec);
    });
    S.push('');
  }
  /* Rahmen und Sicherheit */
  THEMES.forEach(t=>{
    const ek=ekatAnswers(t);
    if(ek.length){
      S.push('## '+t.order+'. '+LB({de:t.title_de,en:t.title_en}),'');
      S.push('*'+(ST.lang==='en'
        ?'Rated as a whole in getting-started mode — applies to every item in this area.'
        :'Im Einstieg als Ganzes bewertet — gilt für alle Punkte dieses Bereichs.')+'*','');
      ek.forEach(e=>S.push('- '+(e.role?LB(ROLE[e.role.slice(1)])+': ':'')+
        scLbl('wunsch',e.v)));
      S.push('');
      return;
    }
    const rows=[];
    t.sections.forEach(s=>{
      const items=visItems(s);
      if(s.type==='multi'){
        const sel=(ST.multi[s.id]||[]);
        if(!sel.length) return;
        rows.push({sec:s,multi:sel.map(id=>IDX.byId[id]).filter(Boolean)});
        return;
      }
      if(s.type==='toys') return;
      const rr=[];
      items.forEach(it=>{
        const n=ST.notes[it.id],note=(n&&n.t&&n.sh)?n.t.replace(/\n/g,' '):'';
        if(it.kind==='text'){ if((ST.tx[it.id]||'').trim())
            rr.push({it:it,text:ST.tx[it.id]}); return; }
        if(it.kind==='wunsch'){
          it.units.forEach(u=>{
            const e=effW(it,u); if(!e.v) return;
            rr.push({it:it,role:u,v:e.v,src:e.src,p:effP(it,u).v,f:effF(it).v,
              x:ST.x[it.id+u]||'',star:!!ST.star[it.id+u],
              rank:ST.rank.indexOf(it.id+u),note:note});
          });
        } else {
          it.units.forEach(u=>{const v=agOf(it,u);
            if(v) rr.push({it:it,role:u,ag:v,note:note});});
        }
      });
      if(rr.length) rows.push({sec:s,rows:rr});
    });
    if(!rows.length) return;
    S.push('## '+t.order+'. '+LB({de:t.title_de,en:t.title_en}),'');
    rows.forEach(b=>{
      S.push('### '+LB({de:b.sec.title_de,en:b.sec.title_en}),'');
      if(b.multi){ b.multi.forEach(it=>S.push('- '+LB({de:it.de,en:it.en}))); S.push(''); return; }
      const hasText=b.rows.some(r=>r.text!=null);
      const hasAg=b.rows.some(r=>r.ag);
      if(hasText){
        b.rows.forEach(r=>{ if(r.text!=null) S.push('**'+LB({de:r.it.de,en:r.it.en})+'**','',r.text,''); });
        return;
      }
      if(hasAg){
        S.push('| Punkt | Rolle | Angabe | Notiz |','|---|---|---|---|');
        b.rows.forEach(r=>S.push('| '+LB({de:r.it.de,en:r.it.en})+
          ' | '+(r.role?LB(roleOf(r.it,r.role)):'—')+' | '+
          scLbl(r.it.kind,r.ag)+' | '+(r.note||'')+' |'));
        S.push('');
        return;
      }
      S.push('| Punkt | Rolle | Bewertung | Quelle | Strafe | Erfahrung | Nur Fantasie | ★ | Rang | Notiz |',
             '|---|---|---|---|---|---|---|---|---|---|');
      b.rows.sort((x,y)=>{
        const rx=x.rank<0?9999:x.rank, ry=y.rank<0?9999:y.rank;
        if(rx!==ry) return rx-ry;
        const d=ORD.indexOf(x.v)-ORD.indexOf(y.v); if(d) return d;
        return x.it.de.localeCompare(y.it.de);});
      b.rows.forEach(r=>S.push('| '+LB({de:r.it.de,en:r.it.en})+
        ' | '+(r.role?LB(roleOf(r.it,r.role)):'—')+
        ' | '+scLbl('wunsch',r.v)+
        ' | '+(r.src==='inh'?'geerbt':'gesetzt')+
        ' | '+(r.p?scLbl('strafe',r.p):'—')+
        ' | '+(r.x?scLbl('erfahrung',r.x):'—')+
        ' | '+(r.f?'ja':'—')+
        ' | '+(r.star?'★':'—')+
        ' | '+(r.rank>=0?(r.rank+1):'—')+
        ' | '+(r.note||'')+' |'));
      S.push('');
    });
  });
  const toys=ST.toys.filter(x=>x&&x.trim());
  if(toys.length){S.push('## Toys und Ausrüstung','');toys.forEach(x=>S.push('- '+x));S.push('');}

  S.push('## Skala','');
  SC.wunsch.forEach(s=>S.push('- **'+s.de+'** — '+s.dde));
  S.push('');
  SC.strafe.forEach(s=>S.push('- **'+s.de+'** — '+s.dde));
  S.push('','Rollen: *Top* = die Handlung ausführen · *Bottom* = die Handlung erfahren. '+
    'Nicht dasselbe wie Dom und Sub — ein Service Top führt aus und dient zugleich.',
    '','*Geerbt* bedeutet: der Wert stammt aus einer Bewertung auf Themen-, Sektions- oder '+
    'Gruppenebene und ist keine ausdrückliche Einzelentscheidung.','');
  S.push('---','',
    'Die folgende Datenstruktur wird beim Import wieder eingelesen. Bitte nicht von Hand ändern.','',
    '```kinkcompass',
    JSON.stringify(bundle()).replace(/`/g,'\\u0060'),
    '```','');
  dl('kinkcompass_'+stamp()+'.md',S.join('\n'),'text/markdown');
}
function importFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let txt=String(r.result),obj=null;
    const m=txt.match(/```kinkcompass\s*\n?([\s\S]*?)```/);
    if(m){ try{obj=JSON.parse(m[1].trim());}catch(e){} }
    if(!obj){ try{obj=JSON.parse(txt);}catch(e){} }
    if(!obj){ alert(ST.lang==='en'
      ?'Could not read the file. Expected JSON, or Markdown with a ```kinkcompass block.'
      :'Datei nicht lesbar. Erwartet wird JSON oder Markdown mit einem ```kinkcompass-Block.'); return; }
    const st=obj.state||obj.raw||obj;
    if(!st||typeof st!=='object'){alert('Kein Zustand gefunden.');return;}
    ST=Object.assign(BLANK(),st);
    if(obj.meta&&!st.meta) ST.meta=obj.meta;
    const rep=migrateState(ST);
    ST.loadedFrom={listRev:(obj.app&&obj.app.listRevision)||null,
      schema:obj.schemaVersion||null, items:(obj.coverage&&obj.coverage.items_total)||null};
    save(); bindMeta(); versionNote(rep); rerender();
    const msg=migSummary(rep);
    alert((ST.lang==='en'?'Loaded.':'Geladen.')+(msg?'\n\n'+msg:''));
  };
  r.readAsText(f); input.value='';
}

/* ==================== Druckansicht ==================== */
function togglePrint(on){

}
function renderPrint(){
