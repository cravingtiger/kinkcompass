<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KinkCompass</title>
<style>
:root{
  --bg:#12141a; --bg2:#181b23; --panel:#1e222c; --panel2:#252a36;
  --line:#333a49; --txt:#e8e6e3; --muted:#9aa0ad; --accent:#8c2f39; --accent2:#b8555f;
  --gold:#c9a227;
  --c-must:#c9a227; --c-neigung:#2f7d5b; --c-sehnsucht:#2f6d8c; --c-interessant:#4a7f8c;
  --c-neutral:#5a6070; --c-soft:#a9662f; --c-hard:#8c2f39; --c-na:#4a5060;
  --c-reizvoll:#6d4b8c; --c-echt:#8c5a2f;
  --c-verbindlich:#8c2f39; --c-gewuenscht:#2f7d5b; --c-verhandelbar:#4a7f8c; --c-nicht-noetig:#4a5060; --c-ablehnend:#8c5a2f;
  --c-keine:#6a7280; --c-einmal:#946f34; --c-gelegentlich:#bf8f33; --c-viel:#e0ab2e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.55 "Inter",-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,h4{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600;letter-spacing:.2px}
a{color:var(--accent2)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 140px}

/* ---------- Kopf ---------- */
header.top{position:sticky;top:0;z-index:40;background:rgba(18,20,26,.95);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;padding:10px 16px}
.titlerow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:0}
.sub{color:var(--muted);font-size:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
button,select,input,textarea{font-family:inherit;font-size:13.5px;color:var(--txt)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:6px 11px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent2);background:#2c3240}
.btn.pri{background:var(--accent);border-color:#a63a45}
.btn.pri:hover{background:#a63a45}
.btn.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:600}
.btn.sm{padding:3px 7px;font-size:11.5px}
input[type=text],input[type=date],select,textarea{background:#14171e;border:1px solid var(--line);
  border-radius:8px;padding:6px 9px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent2)}
#q{flex:1;min-width:150px}
.progwrap{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.prog{flex:1;min-width:190px}
.prog b{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.pbar{height:5px;background:#22262f;border-radius:3px;overflow:hidden;margin-top:3px;position:relative}
.pbar i{position:absolute;left:0;top:0;height:100%;transition:.3s}
.pbar i.set{background:linear-gradient(90deg,var(--accent),var(--gold));z-index:2}
.pbar i.clar{background:#3a4454;z-index:1}
.pinfo{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ---------- Bloecke ---------- */
.intro{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:13px 15px;margin:18px 0;font-size:13.5px;color:#cfd3da}
.intro b{color:var(--txt)}
.meta{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin:16px 0}
.meta h2{font-size:15px;margin:0 0 11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:.3px;text-transform:uppercase}
.f input,.f textarea{width:100%}
.f textarea{min-height:58px;resize:vertical}

/* ---------- Themen / Sektionen / Gruppen ---------- */
.node{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel);overflow:hidden}
.node.theme>.nhead{background:var(--panel2)}
.nhead{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;user-select:none}
.nhead:hover{background:#2a303d}
.tw{width:15px;flex:0 0 15px;color:var(--muted);font-size:11px;transition:transform .15s}
.node.open>.nhead .tw{transform:rotate(90deg)}
.ntitle{flex:1;min-width:0}
.ntitle h3{font-size:16px;margin:0}
.ntitle h4{font-size:14.5px;margin:0}
.nmeta{font-size:11px;color:var(--muted);margin-top:2px}
.nbody{display:none;padding:0 13px 12px}
.node.open>.nbody{display:block}
.node.exempt{border-left:3px solid var(--gold)}
.grp{margin:12px 0 0;border-top:1px solid #262b36;padding-top:9px}
.grp:first-child{border-top:none;padding-top:2px}
.ghead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.nodectl{background:#1a1e26;border:1px dashed var(--line);border-radius:8px;
  padding:6px 9px;margin:4px 0 8px}
.nodewarn{font-size:12px;color:var(--muted);margin:-2px 0 4px;flex-basis:100%}
.ekatwas{font-size:15px;line-height:1.5;color:var(--fg);margin:2px 0 10px}
.nodecap{width:100%;font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:3px;cursor:help}
.ghead h5{font-size:12px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  font-family:inherit;font-weight:600;flex:1;min-width:120px}
.secnote{color:var(--muted);font-size:12.5px;margin:6px 0 10px;padding-left:10px;border-left:2px solid var(--line)}
.badge{font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap}
.badge.hoch{border-color:var(--c-hard);color:#e8a0a6}
.badge.mittel{border-color:var(--c-soft);color:#e0b283}
.badge.skip{border-color:var(--gold);color:var(--gold)}
.badge.inh{border-color:#4a5365;color:#8f98a8;font-style:italic}

/* ---------- Item ---------- */
.row{border-bottom:1px solid #22262f;padding:7px 0}
.row:last-child{border-bottom:none}
.rowmain{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.lbl{flex:1;min-width:190px;font-size:14.5px;display:flex;align-items:flex-start;gap:6px;padding-top:2px}
.lbl .i{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:1px solid var(--line);
  color:var(--muted);font-size:10px;line-height:14px;text-align:center;cursor:pointer;background:#1a1e26;margin-top:2px}
.lbl .i:hover{border-color:var(--gold);color:var(--gold)}
.expl{display:none;font-size:12.5px;color:var(--muted);margin:4px 0 2px;padding-left:22px;max-width:780px}
.row.showexpl .expl,body.allexpl .expl{display:block}
.axes{display:flex;flex-direction:column;gap:3px}
.axrow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.rlbl{font-size:10px;color:var(--muted);width:76px;flex:0 0 76px;text-transform:uppercase;letter-spacing:.4px}
.chip{border:1px solid var(--line);background:#191d25;border-radius:20px;padding:2px 8px;
  font-size:11.5px;cursor:pointer;color:#b8bdc7;white-space:nowrap;transition:.12s}
.chip:hover{border-color:var(--accent2);color:#fff}
.chip.sel{color:#fff;font-weight:600;border-color:transparent;
  box-shadow:0 0 0 1px rgba(255,255,255,.45) inset, 0 1px 3px rgba(0,0,0,.4)}
.chip.sel.inh{box-shadow:none}
.chip.sel[data-v=viel],.chip.sel[data-v=gelegentlich]{color:#1a1a1a}
.chip.inh{border-style:dashed;color:#8f98a8;font-style:italic;opacity:.85}
.chip.blocked{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.chip.star.sel{background:var(--gold);color:#1a1a1a}
.axsep{font-size:10px;color:#4a5060;text-transform:uppercase;letter-spacing:.5px;padding-right:2px}
.cmt{display:none;margin:6px 0 2px;padding-left:22px}
.row.showcmt .cmt{display:block}
.cmt textarea{width:100%;max-width:780px;min-height:44px;resize:vertical}
.cmtbar{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--muted)}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px 14px}
.mi{display:flex;align-items:flex-start;gap:7px;padding:4px 0;border-bottom:1px solid #22262f}
.mi input{margin-top:3px;accent-color:var(--accent2)}
.mi .t{flex:1;font-size:14px}
.mi .expl{padding-left:0}
.tfield{margin:9px 0}
.tfield label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.tfield textarea{width:100%;min-height:54px;resize:vertical}
.toys{display:flex;flex-direction:column;gap:7px;max-width:780px}
.toy{display:flex;gap:7px;align-items:center}
.toy input{flex:1}

/* ---------- Ansichten ---------- */
.view{display:none}
body[data-view=form] #vForm,body[data-view=prio] #vPrio,
body[data-view=eval] #vEval,body[data-view=search] #vSearch,
body[data-view=guide] #vGuide,body[data-view=cmp] #vCmp{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.card h3{margin:0 0 9px;font-size:16px}
.ranklist{list-style:none;margin:0;padding:0;max-width:820px}
.ranki{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);
  border-radius:8px;margin:5px 0;background:#191d25;cursor:grab}
.ranki.drag{opacity:.4}
.ranki.over{border-color:var(--gold)}
.ranki .no{width:26px;flex:0 0 26px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.ranki .rt{flex:1;min-width:0;font-size:14px}
.ranki .rt small{display:block;color:var(--muted);font-size:11px}
.ranki .mv{display:flex;gap:3px}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0}
.egroup{border:1px solid var(--line);border-radius:10px;margin:11px 0;overflow:hidden;background:var(--panel)}
.egroup>h4{margin:0;padding:9px 13px;font-size:14.5px;color:#fff}
.egroup ul{margin:0;padding:9px 13px 12px 28px}
.egroup li{font-size:13.5px;margin:2px 0}
.egroup li small{color:var(--muted)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:8px;cursor:pointer}
.steps li:hover{background:var(--panel2)}
.steps li.cur{background:var(--panel2);border-left:3px solid var(--gold)}
.steps li .sn{width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.steps li .sd{flex:1}
.steps li .ss{font-size:11px;color:var(--muted)}
.gnav{display:flex;gap:8px;justify-content:space-between;margin:16px 0 0}
.hidden{display:none!important}
.foot{color:var(--muted);font-size:12px;margin-top:36px;border-top:1px solid var(--line);padding-top:12px}

/* ---------- Druck ---------- */
#printview{display:none}
body.printmode{background:#fff;color:#141414}
body.printmode .wrap,body.printmode header.top{display:none}
body.printmode #printview{display:block;max-width:900px;margin:48px auto 0;padding:24px 28px 60px;
  background:#fff;color:#141414;font-size:12.5px}
#printview h1{font-size:21px;margin:0 0 2px}
#printview h2{font-size:15px;margin:19px 0 6px;border-bottom:1px solid #bbb;padding-bottom:3px}
#printview h3{font-size:13px;margin:11px 0 4px;color:#333}
#printview table{width:100%;border-collapse:collapse;margin:4px 0 10px}
#printview td,#printview th{border-bottom:1px solid #ddd;padding:3px 6px;vertical-align:top;text-align:left}
#printview th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#555;border-bottom:1px solid #999}
#printview .pnote{font-size:11px;color:#555;font-style:italic}
.printbar{position:fixed;top:0;left:0;right:0;background:#f2f2f2;border-bottom:1px solid #ccc;
  padding:7px 13px;display:none;gap:8px;z-index:99;align-items:center;flex-wrap:wrap}
body.printmode .printbar{display:flex}
.printbar button{background:#fff;border:1px solid #aaa;color:#141414;border-radius:6px;padding:5px 11px;cursor:pointer}
.printbar label{color:#141414;font-size:13px;display:flex;align-items:center;gap:5px}
@media print{
  .printbar{display:none!important}
  body.printmode #printview{margin-top:0;padding:0}
  #printview h2{page-break-after:avoid}
  #printview tr{page-break-inside:avoid}
}
@media (max-width:760px){
  .grid2{grid-template-columns:1fr}
  .rlbl{width:70px;flex:0 0 70px}
  .lbl{min-width:100%}
}
</style>
</head>

<div class="printbar">

  <label><input type="checkbox" id="pExpl" onchange="renderPrint()"> <span id="pL2">Erklärungen mitdrucken</span></label>
</div>

<header class="top">
 <div class="topin">
  <div class="titlerow">
    <h1>KinkCompass</h1>
    <span class="sub" id="subline">läuft vollständig lokal · Speicherung nur in diesem Browser</span>
  </div>
  <div class="bar">
    <select id="mode" onchange="setMode(this.value)" title="Umfang"></select>
    <select id="lang" onchange="setLang(this.value)"><option value="de">Deutsch</option><option value="en">English</option></select>
    <input type="text" id="q" placeholder="Suchen …" oninput="doSearch()">
    <button class="btn" id="bGuide" onclick="setView('guide')">Geführt</button>
    <button class="btn" id="bList" onclick="setView('form')">Liste</button>
    <button class="btn" id="bPrio" onclick="setView('prio')">Prioritäten</button>
    <button class="btn" id="bEval" onclick="setView('eval')">Auswertung</button>
    <button class="btn" id="bCmp" onclick="setView('cmp')">Vergleich</button>
    <button class="btn" id="bPrint" onclick="togglePrint(true)">Druck</button>
    <button class="btn" id="bExpl" onclick="toggleAllExpl()">Erklärungen</button>
    <button class="btn" id="bLegend" onclick="toggleLegend()">Skala</button>
    <button class="btn pri" onclick="exportMD()">Markdown</button>
    <button class="btn pri" onclick="exportJSON()">JSON</button>
    <button class="btn" id="bLoad" onclick="document.getElementById('imp').click()">Laden</button>
    <input type="file" id="imp" accept=".json,.md,.markdown,.txt" style="display:none" onchange="importFile(this)">
    <button class="btn" id="bReset" onclick="resetAll()">Zurücksetzen</button>
  </div>
  <div class="progwrap">
    <div class="prog"><b id="lblProgKink">Neigungen</b>
      <div class="pbar"><i class="clar" id="pbKinkC"></i><i class="set" id="pbKinkS"></i></div>
      <div class="pinfo" id="piKink"></div></div>
    <div class="prog"><b id="lblProgSafe">Rahmen und Sicherheit</b>
      <div class="pbar"><i class="clar" id="pbSafeC"></i><i class="set" id="pbSafeS"></i></div>
      <div class="pinfo" id="piSafe"></div></div>
  </div>
 </div>
</header>

<div class="wrap">
  <div class="intro" id="storagewarn" style="display:none;border-left-color:var(--gold)"></div>
  <div class="intro" id="versionwarn" style="display:none;border-left-color:var(--c-sehnsucht)"></div>
  <div class="intro" id="intro"></div>

  <div class="meta">
    <h2 id="lblMeta">Angaben zur Person</h2>
    <div class="grid2">
      <div class="f"><label id="lblAlias">Pseudonym oder Name</label><input type="text" data-meta="alias"></div>
      <div class="f"><label id="lblDate">Datum</label><input type="date" data-meta="date"></div>
      <div class="f"><label id="lblSelf">Rolle / Selbstbeschreibung</label><input type="text" data-meta="self" placeholder="z. B. Switch, eher submissiv, unerfahren"></div>
      <div class="f"><label id="lblVer">Version / Kontext</label><input type="text" data-meta="version" placeholder="z. B. Fassung 1, für Gespräch am …"></div>
    </div>
    <div class="f" style="margin-top:10px"><label id="lblFree">Freie Notiz</label><textarea data-meta="note"></textarea></div>
  </div>

  <div id="vLegend" style="display:none"></div>
  <div class="view" id="vGuide"></div>
  <div class="view" id="vForm"></div>
  <div class="view" id="vSearch"></div>
  <div class="view" id="vPrio"></div>
  <div class="view" id="vEval"></div>
  <div class="view" id="vCmp"></div>
  <input type="file" id="cmpa" accept=".json,.md,.markdown,.txt" style="display:none" onchange="loadProfile('a',this)">
  <input type="file" id="cmpb" accept=".json,.md,.markdown,.txt" style="display:none" onchange="loadProfile('b',this)">

  <div class="card" id="refs" style="margin-top:28px"></div>
  <div class="foot" id="foot"></div>
</div>

e and body data","type":"scale","note_de":"Gesundheitsbezogene Kontrolle wirkt langsam und ist von außen schwer zu erkennen. Ernährungs- und Gewichtskontrolle kann eine Essstörung verstärken oder verdecken, und die Dynamik liefert die Rechtfertigung gleich mit. Gemeldete Werte wie Blutdruck oder Blutzucker ersetzen keine ärztliche Behandlung und können sie verzögern. Die Gegenstücke dazu stehen in **Rahmen und Sicherheit** unter *Gesundheit, Daten und Selbstbestimmung* und werden in keinem Modus gekürzt.","note_en":"Health-related control works slowly and is hard to see from outside. Control over food and weight can reinforce or conceal an eating disorder, and the dynamic supplies the justification along with it. Reported values such as blood pressure or blood sugar do not replace medical treatment and can delay it. The counterparts are in **Framework and safety** under *Health, data and self-determination*, and they are never shortened.","groups":[{"id":"ernaehrung","title_de":"Ernährung","title_en":"Food"},{"id":"bewegung","title_de":"Bewegung und Schlaf","title_en":"Exercise and sleep"},{"id":"messwerte-melden","title_de":"Messwerte melden","title_en":"Reporting measurements"},{"id":"rahmen-gesundheit","title_de":"Rahmen","title_en":"Framing"}],"n":20,"noinherit":null}],"ekat":true,"ekat_de":"Begleitung im Alltag: tägliche Meldung, Aufgaben mit Nachweis, Kamera zu vereinbarten Zeiten, Absprachen über Ernährung, Sport und Gewicht.","ekat_en":"Guidance in everyday life: daily check-ins, tasks with proof, a camera during agreed hours, agreements about food, exercise and weight.","exempt":false},{"id":"bondage","title_de":"Bondage und Bewegungseinschränkung","title_en":"Bondage and restriction of movement","order":5,"sections":[{"id":"bondage-allgemein","title_de":"Bondage allgemein","title_en":"Bondage in general","type":"scale","note_de":"","note_en":"","groups":[{"id":"positionen","title_de":"Fesselpositionen","title_en":"Tie positions"},{"id":"fixierungsorte","ti now them by name should you meet them outside a scene.","groups":[{"id":"wahrnehmung","title_de":"Wahrnehmung und Erinnerung","title_en":"Perception and memory"},{"id":"bindung","title_de":"Bindung durch Unberechenbarkeit","title_en":"Attachment through unpredictability"},{"id":"massstaebe","title_de":"Unerreichbare Maßstäbe","title_en":"Unreachable standards"},{"id":"dritte","title_de":"Dritte Personen","title_en":"Third parties"},{"id":"gruppe","title_de":"Gruppe, Sprache und Zugehörigkeit","title_en":"Group, language and belonging"},{"id":"verpflichtung","title_de":"Verpflichtung und Eskalation","title_en":"Commitment and escalation"},{"id":"grenzen-manipulation","title_de":"Grenzen","title_en":"Limits"}],"n":39,"noinherit":null},{"id":"blackmail-blossstellung","title_de":"Blackmail und Bloßstellung","title_en":"Blackmail and exposure","type":"scale","note_de":"Einvernehmliches Blackmail-Spiel lebt von einer Drohung. Das macht es zu einem Sonderfall: **die Drohung richtet sich gegen die Möglichkeit, das Spiel zu beenden.** Wer erpresst wird, kann schlecht abbrechen — genau darin liegt der Reiz, und genau darin liegt die Gefahr. Ein Safeword allein trägt hier nicht; es braucht Regeln darüber, was überhaupt gehalten wird, und jemanden außerhalb. Die Grenzen dazu stehen am Ende der Sektion. Rechtlich: eine vorher erteilte Zustimmung macht eine später ernst gemeinte Drohung nicht zulässig (Erpressung § 253 StGB, Nötigung § 240 StGB), und intime Aufnahmen weiterzugeben ist auch dann strafbar, wenn ihre Entstehung einvernehmlich war (§ 201a StGB). Keine Rechtsberatung.","note_en":"Consensual blackmail play lives off a threat. That makes it a special case: **the threat is aimed at your ability to end the game.** Someone being blackmailed can hardly call it off — that is exactly the appeal, and exactly the danger. A safeword alone does not carry it here; it needs rules about what is held at all, and someone outside. The limits are at the end of this section. Legally: con ns"},{"id":"standortdaten","title_de":"Standort- und Aktivitätsdaten","title_en":"Location and activity data"},{"id":"virtuell","title_de":"Online, VR und Games","title_en":"Online, VR and games"},{"id":"digitale-sicherheit","title_de":"Digitale Sicherheit","title_en":"Digital safety"}],"n":29,"noinherit":null},{"id":"geld-findom","title_de":"Geld, Geschenke und FinDom","title_en":"Money, gifts and findom","type":"scale","note_de":"Zulässig gemeint sind transparente, freiwillige und finanziell tragbare Vereinbarungen. Reale Täuschung, Drohung, Erpressung, Ausnutzung von Abhängigkeit oder Zugriff ohne aktuelle Erlaubnis sind keine legitimen BDSM-Praktiken.","note_en":"What is meant here are transparent, voluntary and financially bearable arrangements. Real deception, threats, extortion, exploiting dependency, or access without current permission are not legitimate BDSM practices.","groups":[{"id":"geschenke","title_de":"Geschenke und Tribute","title_en":"Gifts and tributes"},{"id":"findom","title_de":"FinDom und Budgetspiele","title_en":"Findom and budget play"},{"id":"bezahlt","title_de":"Bezahlte Angebote","title_en":"Paid services"},{"id":"schutzgrenzen","title_de":"Finanzielle Schutzgrenzen","title_en":"Financial safeguards"}],"n":22,"noinherit":null}],"ekat":true,"ekat_de":"Wer noch dabei ist und was festgehalten wird: beobachten und beobachtet werden, Fotos und Videos, Sexting, mehr als zwei Personen, D/s über Distanz, Geschenke und Geld.","ekat_en":"Who else is present and what gets recorded: watching and being watched, photos and video, sexting, more than two people, D/s at a distance, gifts and money.","exempt":false},{"id":"koerper-medizin","title_de":"Körper, Nahrung und Medizinisches","title_en":"Body, food and medical","order":13,"sections":[{"id":"food-wet-messy","title_de":"Food, Wet and Messy","title_en":"Food, wet and messy","type":"scale","note_de":"","note_en":"","groups":[{"id":"fuettern","title_de":"Essen und Füttern","title_en":"Eating and feedi  carry an above-average risk of injury or death. Breath control, neck compression, electricity, flames and strong heat are not covered by consent across the board; in particular, an objectively concrete danger to life crosses the line under German case law.[^5]","groups":[{"id":"elektro","title_de":"Elektro","title_en":"Electricity"},{"id":"feuer","title_de":"Feuer und Hitze","title_en":"Fire and heat"},{"id":"rauch","title_de":"Rauch und Zigarrenästhetik","title_en":"Smoke and cigar aesthetics"},{"id":"atem","title_de":"Atemkontrolle","title_en":"Breath control"}],"n":21,"noinherit":null}],"ekat":false,"ekat_de":"","ekat_en":"","exempt":false},{"id":"fantasie","title_de":"Fantasie und Imagination","title_en":"Fantasy and imagination","order":15,"sections":[{"id":"reine-fantasie","title_de":"Reine Fantasie ohne Umsetzung","title_en":"Pure fantasy, not to be enacted","type":"scale","note_de":"Diese Rubrik ermöglicht, erregende Gedanken von realen Wünschen zu trennen. Auch bei legalen Fantasien kann die reale Umsetzung ungewollt, unsicher oder rechtswidrig sein; `F` ist daher eine eigenständige und sinnvolle Präferenz.","note_en":"This section lets you separate arousing thoughts from real wishes. Even with lawful fantasies, acting them out can be unwanted, unsafe or unlawful; treating fantasy as its own category is therefore a meaningful preference in its own right.","groups":[{"id":"medien","title_de":"Fantasie in Medien","title_en":"Fantasy in media"},{"id":"macht-fantasie","title_de":"Macht und Kontrollverlust","title_en":"Power and loss of control"},{"id":"szenarien","title_de":"Imaginierte Szenarien","title_en":"Imagined scenarios"},{"id":"genre-fantasie","title_de":"Transformation und Genre","title_en":"Transformation and genre"},{"id":"grenze","title_de":"Grenze zur Umsetzung","title_en":"The line to enactment"}],"n":25,"noinherit":null}],"ekat":true,"ekat_de":"Was nur im Kopf oder in Worten stattfindet: Geschichten lesen und erzählen, Audio-Erotik, Fantasien, ton; they are exported in structured form in both JSON and Markdown.","groups":[],"n":0,"noinherit":null}],"ekat":false,"ekat_de":"","ekat_en":"","exempt":false}],"choices":{"leitmodell":[{"v":"ssc","label_de":"Safe, Sane, Consensual (SSC)","label_en":"Safe, Sane, Consensual (SSC)","desc_de":"Die älteste der Formeln, aus der US-Szene der 1980er. Eine Praktik soll sicher, bei klarem Verstand und einvernehmlich sein. Kritisiert wird, dass „sicher\" und „vernünftig\" Urteile von außen sind — viele etablierte Praktiken sind nie vollständig sicher.","desc_en":"The oldest of the formulas, from the US scene of the 1980s. A practice should be safe, undertaken with a clear mind, and consensual. The criticism is that „safe\" and „sane\" are judgements made from outside — many established practices are never entirely safe."},{"v":"rack","label_de":"Risk-Aware Consensual Kink (RACK)","label_en":"Risk-Aware Consensual Kink (RACK)","desc_de":"Die Antwort auf diese Kritik. Nicht „sicher\", sondern: das konkrete Risiko ist bekannt, benannt und bewusst getragen. Verlangt, sich vorher kundig zu machen, statt Risiko wegzudefinieren.","desc_en":"The answer to that criticism. Not „safe\", but: the specific risk is known, named and knowingly carried. It asks you to inform yourself beforehand rather than define the risk away."},{"v":"prick","label_de":"Personal Responsibility, Informed, Consensual Kink (PRICK)","label_en":"Personal Responsibility, Informed, Consensual Kink (PRICK)","desc_de":"Wie RACK, betont zusätzlich die Eigenverantwortung jeder beteiligten Person. Niemand gibt die Verantwortung für sich vollständig ab, auch nicht die folgende Seite.","desc_en":"Like RACK, but additionally stressing each person's own responsibility. Nobody hands responsibility for themselves over entirely, including the following side."},{"v":"ccc","label_de":"Committed, Compassionate, Consensual (CCC)","label_en":"Committed, Compassionate, Consensual (CCC)","desc_de":"Stellt die Beziehung über die einzelne Szene: Verbindlichkeit und Fürsorge gelten auch danach. Weniger Risikoformel als Haltung zum Miteinander.","desc_en":"Puts the relationship above the single scene: commitment and care apply afterwards too. Less a risk formula than a stance on how you treat each other."},{"v":"eigen","label_de":"eigenes Modell","label_en":"my own framework","desc_de":"Keines der Modelle trifft es — du beschreibst deine Haltung selbst.","desc_en":"None of the models fits — you describe your own stance."},{"v":"unklar","label_de":"noch nicht festgelegt","label_en":"not settled yet","desc_de":"Du hast dich noch nicht entschieden — eine ehrliche und im Gespräch brauchbare Angabe.","desc_en":"You have not decided — an honest answer, and a usable one in conversation."}],"spuren":[{"v":"nie","label_de":"nie","label_en":"never","desc_de":"Nichts, was jemand sehen könnte — auch nicht unter Kleidung.","desc_en":"Nothing anyone could see, not even under clothing."},{"v":"vereinbart","label_de":"nur ausdrücklich vereinbart","label_en":"only when expressly agreed","desc_de":"Spuren sind möglich, aber jedes Mal vorher abgesprochen.","desc_en":"Marks are possible, but agreed each time beforehand."},{"v":"egal","label_de":"unproblematisch","label_en":"not a problem","desc_de":"Sichtbare Spuren sind für dich kein Thema.","desc_en":"Visible marks are not an issue for you."}],"spuren-bleibend":[{"v":"nie","label_de":"nie","label_en":"never","desc_de":"Nichts, was dauerhaft bleibt: keine Narben, keine Brandzeichen.","desc_en":"Nothing that stays: no scars, no brands."},{"v":"vereinbart","label_de":"nur ausdrücklich vereinbart","label_en":"only when expressly agreed","desc_de":"Dauerhafte Spuren sind denkbar, aber nur nach eigener, ausdrücklicher Vereinbarung.","desc_en":"Permanent marks are conceivable, but only under their own express agreement."}],"herabsetzung":[{"v":"nie","label_de":"nie","label_en":"never","desc_de":"Diese Kategorie kommt nicht vor, in keiner Form und in keinem Wort.","desc_en":"This category does not come up, in any form and in no word."},{"v":"whitelist","label_de":"nur nach Wort-Whitelist","label_en":"only from the agreed word list","desc_de":"Nur die Worte, die du oben ausdrücklich freigegeben hast.","desc_en":"Only the words you expressly released above."},{"v":"offen","label_de":"offen","label_en":"open","desc_de":"Du setzt hier keine Kategoriegrenze — die Wortlisten oben gelten trotzdem.","desc_en":"You set no category boundary here — the word lists above still apply."}],"genderrollen":[{"v":"verstaerken","label_de":"verstärken","label_en":"reinforce them","desc_de":"Die Dynamik greift gängige Geschlechterbilder auf und spitzt sie zu.","desc_en":"The dynamic picks up common gender images and sharpens them."},{"v":"umkehren","label_de":"spielerisch umkehren","label_en":"playfully invert them","desc_de":"Der Reiz liegt darin, die erwartete Verteilung umzudrehen.","desc_en":"The appeal lies in reversing the expected distribution."},{"v":"irrelevant","label_de":"irrelevant","label_en":"irrelevant","desc_de":"Geschlechterbilder spielen in deinem Spiel keine Rolle.","desc_en":"Gender images play no part in your play."},{"v":"unklar","label_de":"weiß ich nicht","label_en":"I don't know","desc_de":"Du hast dazu noch keine Haltung — auch das ist eine Antwort.","desc_en":"You have no position on this yet — that is an answer too."}],"aufwertung":[{"v":"aufwertung","label_de":"als Aufwertung","label_en":"as elevation","desc_de":"Gemeint als etwas Schönes, Begehrtes, Erhebendes.","desc_en":"Meant as something beautiful, desired, elevating."},{"v":"herabsetzung","label_de":"als Herabsetzung","label_en":"as degradation","desc_de":"Gemeint als Erniedrigung — der Reiz liegt genau darin.","desc_en":"Meant as degradation — that is exactly where the appeal lies."},{"v":"beides","label_de":"je nach Rahmen","label_en":"depends on the framing","desc_de":"Beides möglich — die Bedeutung entsteht erst in der Szene.","desc_en":"Either is possible — the meaning arises in the scene."},{"v":"nicht","label_de":"nicht Teil des Spiels","label_en":"not part of my play","desc_de":"Kommt bei dir nicht vor.","desc_en":"It does not come up for you."}],"wer":[{"v":"ich","label_de":"ich","label_en":"me","desc_de":"Diese Arbeit liegt bei dir.","desc_en":"This work sits with you."},{"v":"gegenueber","label_de":"Gegenüber","label_en":"my counterpart","desc_de":"Diese Arbeit liegt bei der anderen Person.","desc_en":"This work sits with the other person."},{"v":"geteilt","label_de":"geteilt","label_en":"shared","desc_de":"Ihr teilt euch die Arbeit.","desc_en":"You share the work."},{"v":"offen","label_de":"noch offen","label_en":"still open","desc_de":"Ungeklärt — und damit ein Gesprächspunkt.","desc_en":"Unsettled — and therefore something to talk about."}]}},"items":{"risikomodell":{"items":[{"id":"risikomodell/nach-welchem-modell-arbeitest-du","group":"leitbild","de":"Nach welchem Modell arbeitest du?","en":"Which framework do you work by?","expl_de":"Verbreitete Modelle für den Umgang mit Risiko; sie ersetzen weder Fachkunde noch das Recht.","expl_en":"Common frameworks for handling risk; they replace neither expertise nor the law.","ap":false,"level":"e","risk":null,"scale":"leitmodell"},{"id":"risikomodell/eigenes-modell-in-eigenen-worten","group":"leitbild","de":"Eigenes Modell, in eigenen Worten","en":"My own framework, in my own words","expl_de":"Freitext, falls keines der Modelle passt oder du es anders formulierst.","expl_en":"Free text if none of the models fits or you would put it differently.","ap":false,"level":"s","risk":null,"scale":"text"},{"id":"risikomodell/nuechtern-bleiben","group":"voraussetzungen","de":"Nüchtern bleiben","en":"Staying sober","expl_de":"Kein Alkohol und keine anderen Substanzen bei allen Beteiligten, vor und während einer Szene.","expl_en":"No alcohol or other substances for anyone involved, before and during a scene.","ap":false,"level":"e","risk":null,"scale":null},{"id":"risikomodell/abbruch-bei-eingeschraenkter-einwilligungsfaehigkeit","group":"voraussetzungen","de":"Abbruch bei eingeschränkter Einwilligungsfähigkeit","en":"Stopping when consent capacity is impaired","expl_de":"Keine Szene, wenn jemand berauscht, übermüdet oder im Ausnahmezustand ist.","expl_en":"No scene when someone is intoxicated, exhausted or in crisis.","ap":false,"level":"e","risk":null,"scale":null},{"id":"risikomodell/erste-hilfe-beherrschen","group":"voraussetzungen","de":"Erste Hilfe beherrschen","en":"Being able to give first aid","expl_de":"Mindestens eine beteiligte Person kann Erste Hilfe leisten.","expl_en":"At least one person involved can give first aid.","ap":true,"level":"s","risk":null,"scale":null},{"id":"risikomodell/bereitschaft-bei-unsicherheit-sofort-abzubrechen","group":"voraussetzungen","de":"Bereitschaft, bei Unsicherheit sofort abzubrechen","en":"Willing to stop immediately when unsure","expl_de":"Im Zweifel wird abgebrochen, ohne dass das als Versagen gilt.","expl_en":"When in doubt the scene stops, and that does not count as failure.","ap":false,"level":"s","risk":null,"scale":null},{"id":"risikomodell/abbruch-und-debrief-nach-einem-fehler","group":"voraussetzungen","de":"Abbruch und Debrief nach einem Fehler","en":"Stopping and debriefing after a mistake","expl_de":"Wenn etwas schiefgeht, endet die Szene und wird danach besprochen.","expl_en":"If something goes wrong the scene ends and is talked through afterwards.","ap":false,"level":"s","risk":null,"scale":null},{"id":"risikomodell/sichtbare-spuren","group":"spuren","de":"Sichtbare Spuren","en":"Visible marks","expl_de":"Röte, Abdrücke oder blaue Flecken, die andere sehen könnten.","expl_en":"Redness, marks or bruises that other people might see.","ap":false,"level":"s","risk":null,"scale":"spuren"},{"id":"risikomodell/bleibende-spuren","group":"spuren","de":"Bleibende Spuren","en":"Permanent marks","expl_de":"Narben, Tätowierungen, Brandzeichen: alles, was nicht von selbst verschwindet.","expl_en":"Scars, tattoos, brands: anything that does not fade by itself.","ap":false,"level":"s","risk":null,"scale":"spuren-bleibend"}],"dropped":[]},"reale-machtverhaeltnisse":{"items":[{"id":"reale-machtverhaeltnisse/ansprechperson-ausserhalb-benennen","group":"absicherung","de":"Ansprechperson außerhalb benennen","en":"Naming a contact outside the dynamic","expl_de":"Jemand außerhalb, der eingeweiht ist und dem man sich melden kann.","expl_en":"Someone outside who knows about it and can be turned to.","ap":true,"level":"s","risk":null,"scale":null},{"id":"reale-machtverhaeltnisse/ausstiegsplan-schriftlich-festhalten","group":"absicherung","de":"Ausstiegsplan schriftlich festhalten","en":"Writing down an exit plan","expl_de":"Bevor etwas Dauerhaftes beginnt, steht schriftlich fest, wie es endet und was dann gilt.","expl_en":"Before anything lasting begins, it is written down how it ends and what applies then.","ap":true,"level":"s","risk":null,"scale":null},{"id":"reale-machtverhaeltnisse/dynamik-befristen-oder-ueberpruefen","group":"absicherung","de":"Dynamik befristen oder überprüfen","en":"Setting a term or review date","expl_de":"Die Dynamik läuft nicht unbefristet, sondern wird zu einem festen Termin überprüft.","expl_en":"The dynamic does not run indefinitely but is reviewed at a set date.","ap":true,"level":"s","risk":null,"scale":null},{"id":"reale-machtverhaeltnisse/eigene-finanzielle-unabhaengigkeit","group":"absicherung","de":"Eigene finanzielle Unabhängigkeit","en":"Your own financial independence","expl_de":"Du bleibst in der Lage, ohne die andere Person finanziell weiterzuleben.","expl_en":"You remain able to go on living financially without the other person.","ap":true,"level":"s","risk":null,"scale":null},{"id":"reale-machtverhaeltnisse/eigene-wohnmoeglichkeit-sichern","group":"absicherung","de":"Eigene Wohnmöglichkeit sichern","en":"Securing your own housing option","expl_de":"Eine Wohnmöglichkeit, die nicht an der Dynamik hängt.","expl_en":"Somewhere to live that does not depend on the dynamic.","ap":true,"level":"s","risk":null,"scale":null},{"id":"reale-machtverhaeltnisse/nuechtern-verhandeln","group":"absicherung","de":"Nüchtern verhandeln","en":"Negotiating sober","expl_de":"Verhandelt wird nüchtern und ohne akuten Druck, nicht mitten in einer Szene.","expl_en":"Negotiation happens sober and without acute pressure, not mid-scene.","ap":false,"level":"s","risk":null,"scale":null},{"id":"reale-machtverhaeltnisse/auf-augenhoehe-verhandeln","group":"absicherung","de":"Auf Augenhöhe verhandeln","en":"Negotiating as equals","expl_de":"Beim Verhandeln gilt die Dynamik nicht; hier sprechen zwei Gleiche.","expl_en":"The dynamic does not apply while negotiating; there you speak as equals.","ap":false,"level":"s","risk":null,"scale":null}],"dropped":[]},"sprache-wortliste":{"items":[{"id":"sprache-wortliste/belohnende-ansprache","group":"listen","de":"Belohnende Ansprache","en":"Rewarding address","expl_de":"Wie klingt Lob, das dich wirklich erreicht? Kosenamen, Titel, Anerkennung.","expl_en":"What does praise sound like when it actually reaches you? Pet names, titles, recognition.","ap":false,"level":"s","risk":null,"scale":"text"},{"id":"sprache-wortliste/herabsetzende-ansprache","group":"listen","de":"Herabsetzende Ansprache","en":"Degrading address","expl_de":"Was ist für dich eine Beschimpfung, die wirkt? Diese Liste ist eine Freigabe, kein Verbot.","expl_en":"What counts as an insult that works on you? This list is a release, not a ban.","ap":false,"level":"s","risk":null,"scale":"text"},{"id":"sprache-wortliste/absolut-ausgeschlossene-worte","group":"listen","de":"Absolut ausgeschlossene Worte","en":"Words absolutely excluded","expl_de":"Worte, die nie fallen, auch nicht im Affekt und auch nicht als Zitat.","expl_en":"Words that are never used, not in the heat of the moment and not as a quotation.","ap":false,"level":"s","risk":null,"scale":"text"},{"id":"sprache-wortliste/sexistische-herabsetzung","group":"kategorien","de":"Sexistische Herabsetzung","en":"Sexist degradation","expl_de":"Herabsetzung, die an Geschlecht anknüpft.","expl_en":"Degradation that keys on gender.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/rassistische-oder-ethnisch-bezogene-herabsetzung","group":"kategorien","de":"Rassistische oder ethnisch bezogene Herabsetzung","en":"Racist or ethnicity-based degradation","expl_de":"Herabsetzung, die an Hautfarbe oder ethnische Zuschreibung anknüpft.","expl_en":"Degradation that keys on skin colour or ethnic ascription.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/herabsetzung-mit-bezug-auf-herkunft-oder-sprache","group":"kategorien","de":"Herabsetzung mit Bezug auf Herkunft oder Sprache","en":"Degradation based on origin or language","expl_de":"Herabsetzung wegen Herkunftsland, Dialekt oder Akzent.","expl_en":"Degradation because of country of origin, dialect or accent.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/koerper-und-gewichtsbezogene-herabsetzung","group":"kategorien","de":"Körper- und gewichtsbezogene Herabsetzung","en":"Body- and weight-based degradation","expl_de":"Herabsetzung, die an Figur, Gewicht oder Körpermerkmale anknüpft.","expl_en":"Degradation that keys on figure, weight or physical features.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/behinderungs-oder-krankheitsbezogene-herabsetzung","group":"kategorien","de":"Behinderungs- oder krankheitsbezogene Herabsetzung","en":"Disability- or illness-based degradation","expl_de":"Herabsetzung, die an Behinderung, Diagnose oder Krankheit anknüpft.","expl_en":"Degradation that keys on disability, diagnosis or illness.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/herabsetzung-mit-bezug-auf-gender-oder-orientierung","group":"kategorien","de":"Herabsetzung mit Bezug auf Gender oder Orientierung","en":"Degradation based on gender or orientation","expl_de":"Herabsetzung, die an Geschlechtsidentität oder sexuelle Orientierung anknüpft.","expl_en":"Degradation that keys on gender identity or sexual orientation.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/herabsetzung-mit-bezug-auf-religion","group":"kategorien","de":"Herabsetzung mit Bezug auf Religion","en":"Degradation based on religion","expl_de":"Herabsetzung, die an Glauben oder religiöse Zugehörigkeit anknüpft.","expl_en":"Degradation that keys on faith or religious affiliation.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/intelligenz-und-leistungsbezogene-herabsetzung","group":"kategorien","de":"Intelligenz- und leistungsbezogene Herabsetzung","en":"Intelligence- or performance-based degradation","expl_de":"Herabsetzung als dumm, unfähig oder nutzlos.","expl_en":"Degradation as stupid, incapable or useless.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/sexuelle-herabsetzung","group":"kategorien","de":"Sexuelle Herabsetzung","en":"Sexual degradation","expl_de":"Herabsetzung über sexuelles Verhalten, etwa Slut-Shaming.","expl_en":"Degradation about sexual behaviour, such as slut-shaming.","ap":false,"level":"s","risk":null,"scale":"herabsetzung"},{"id":"sprache-wortliste/geltung-nur-innerhalb-der-szene","group":"geltung","de":"Geltung nur innerhalb der Szene","en":"Applies only within the scene","expl_de":"Die freigegebene Sprache gilt außerhalb nicht, auch nicht andeutungsweise.","expl_en":"The released language does not apply outside, not even as a hint.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sprache-wortliste/neue-worte-vorher-freigeben","group":"geltung","de":"Neue Worte vorher freigeben","en":"Releasing new words beforehand","expl_de":"Die Liste wächst im Gespräch davor, nie spontan mitten in der Szene.","expl_en":"The list grows in conversation beforehand, never spontaneously mid-scene.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sprache-wortliste/abbruch-bei-nicht-freigegebenem-wort","group":"geltung","de":"Abbruch bei nicht freigegebenem Wort","en":"Stopping at a non-released word","expl_de":"Fällt ein solches Wort, endet die Szene, ohne dass darüber verhandelt wird.","expl_en":"If such a word is used the scene ends, and that is not up for debate.","ap":false,"level":"s","risk":null,"scale":null}],"dropped":[]},"gender-alltag":{"items":[{"id":"gender-alltag/genderrollen-im-spiel","group":"rollenbilder","de":"Genderrollen im Spiel","en":"Gender roles in play","expl_de":"Ob die Dynamik gängige Geschlechterbilder aufgreift, umdreht oder ganz ohne sie auskommt.","expl_en":"Whether the dynamic picks up common gender images, inverts them, or does without them.","ap":false,"level":"s","risk":null,"scale":"genderrollen"},{"id":"gender-alltag/feminisierung-ist-fuer-mich","group":"rollenbilder","de":"Feminisierung ist für mich","en":"Feminisation means, for me","expl_de":"Entscheidend ist nicht die Handlung, sondern ob sie als Aufwertung oder als Erniedrigung gemeint ist.","expl_en":"What matters is not the act but whether it is meant as elevation or as degradation.","ap":false,"level":"s","risk":null,"scale":"aufwertung"},{"id":"gender-alltag/maskulinisierung-ist-fuer-mich","group":"rollenbilder","de":"Maskulinisierung ist für mich","en":"Masculinisation means, for me","expl_de":"Entscheidend ist nicht die Handlung, sondern ob sie als Aufwertung oder als Erniedrigung gemeint ist.","expl_en":"What matters is not the act but whether it is meant as elevation or as degradation.","ap":false,"level":"s","risk":null,"scale":"aufwertung"},{"id":"gender-alltag/unterschied-zwischen-spiel-und-alltag","group":"rollenbilder","de":"Unterschied zwischen Spiel und Alltag","en":"A difference between play and everyday life","expl_de":"Das Machtgefälle im Spiel ist gerade deshalb reizvoll, weil der Alltag anders aussieht.","expl_en":"The power imbalance in play appeals precisely because everyday life looks different.","ap":false,"level":"s","risk":null,"scale":null},{"id":"gender-alltag/gleichberechtigter-alltag","group":"rollenbilder","de":"Gleichberechtigter Alltag","en":"Everyday life on equal terms","expl_de":"Was im Spiel gilt, gilt außerhalb ausdrücklich nicht.","expl_en":"What applies in play expressly does not apply outside it.","ap":false,"level":"s","risk":null,"scale":null},{"id":"gender-alltag/planung-und-organisation-der-szenen","group":"arbeitsteilung","de":"Planung und Organisation der Szenen","en":"Planning and organising scenes","expl_de":"Wer sucht Termine, besorgt Material und denkt den Ablauf durch.","expl_en":"Who finds the dates, gets the gear and thinks the scene through.","ap":false,"level":"s","risk":null,"scale":"wer"},{"id":"gender-alltag/aftercare-und-emotionale-nacharbeit","group":"arbeitsteilung","de":"Aftercare und emotionale Nacharbeit","en":"Aftercare and emotional follow-up","expl_de":"Wer trägt die emotionale Arbeit danach; sie verteilt sich oft unbemerkt ungleich.","expl_en":"Who carries the emotional work afterwards; it is often unevenly distributed without anyone noticing.","ap":false,"level":"s","risk":null,"scale":"wer"},{"id":"gender-alltag/verhandlung-und-initiative","group":"arbeitsteilung","de":"Verhandlung und Initiative","en":"Negotiation and initiative","expl_de":"Wer spricht Themen an und bringt Wünsche zur Sprache.","expl_en":"Who raises topics and puts wishes into words.","ap":false,"level":"s","risk":null,"scale":"wer"},{"id":"gender-alltag/bildung-und-recherche","group":"arbeitsteilung","de":"Bildung und Recherche","en":"Learning and research","expl_de":"Wer liest sich ein, besucht Workshops und bringt Wissen mit.","expl_en":"Who reads up, attends workshops and brings in knowledge.","ap":false,"level":"s","risk":null,"scale":"wer"},{"id":"gender-alltag/rollenbilder-die-ich-nicht-reproduzieren-will","group":"reflexion","de":"Rollenbilder, die ich nicht reproduzieren will","en":"Role images I do not want to reproduce","expl_de":"Freitext für das, was im Spiel nicht vorkommen soll, auch wenn es technisch möglich wäre.","expl_en":"Free text for what should not appear in play even though it would technically be possible.","ap":false,"level":"s","risk":null,"scale":"text"}],"dropped":[]},"gesundheit-selbstbestimmung":{"items":[{"id":"gesundheit-selbstbestimmung/behandlung-in-aerztlicher-hand","group":"medizin","de":"Behandlung in ärztlicher Hand","en":"Treatment in medical hands","expl_de":"Diagnose und Behandlung gehören zur Ärztin und sind nicht Teil der Dynamik.","expl_en":"Diagnosis and treatment belong with a doctor and are not part of the dynamic.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/eigene-entscheidung-ueber-medikamente","group":"medizin","de":"Eigene Entscheidung über Medikamente","en":"Your own decision about medication","expl_de":"Niemand entscheidet für die andere Person über Medikamente, Dosis oder Therapie.","expl_en":"Nobody decides for the other person about medication, dosage or therapy.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/aerztliche-rueckkopplung-der-gesundheitsziele","group":"medizin","de":"Ärztliche Rückkopplung der Gesundheitsziele","en":"Medical review of health goals","expl_de":"Ziele zu Gewicht, Ernährung oder Sport werden ärztlich gegengelesen.","expl_en":"Goals about weight, food or exercise are checked with a doctor.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/aerztlich-festgelegte-untergrenzen","group":"grenzwerte","de":"Ärztlich festgelegte Untergrenzen","en":"Medically set lower limits","expl_de":"Wo die Untergrenze für Gewicht und Kalorien liegt, entscheidet eine ärztliche Einschätzung, nicht die Dynamik.","expl_en":"Where the lower limit for weight and calories lies is decided medically, not by the dynamic.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/ernaehrung-und-gewicht-ausserhalb-der-dynamik","group":"grenzwerte","de":"Ernährung und Gewicht außerhalb der Dynamik","en":"Food and weight outside the dynamic","expl_de":"Kontrolle über Essen und Gewicht bleibt draußen. Eine Essstörung in der Vorgeschichte ist ein häufiger und starker Grund dafür — du musst ihn aber nicht angeben.","expl_en":"Control over food and weight stays out. A history of an eating disorder is a common and strong reason, but you do not have to state it.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/nach-unten-korrigierbare-ziele","group":"grenzwerte","de":"Nach unten korrigierbare Ziele","en":"Goals that can be revised downwards","expl_de":"Ziele werden regelmäßig überprüft, und sie zu senken ist ausdrücklich erlaubt und kein Versagen.","expl_en":"Goals are reviewed regularly, and lowering one is expressly allowed and not a failure.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/straffreiheit-fuer-messwerte","group":"messwerte","de":"Straffreiheit für Messwerte","en":"No punishment for measurements","expl_de":"Eine Zahl ist eine Information, kein Anlass für eine Konsequenz.","expl_en":"A number is information, not grounds for a consequence.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/konsequenzen-nur-fuer-verhalten","group":"messwerte","de":"Konsequenzen nur für Verhalten","en":"Consequences only for behaviour","expl_de":"Sie knüpfen an vereinbartes Verhalten an, nie an ein Messergebnis.","expl_en":"They attach to agreed behaviour, never to a measurement.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/ueberwachung-jederzeit-abschaltbar","group":"ueberwachungsgrenzen","de":"Überwachung jederzeit abschaltbar","en":"Monitoring can be switched off at any time","expl_de":"Ohne Begründung und ohne Folgen.","expl_en":"Without giving reasons and without consequences.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/loeschfrist-fuer-nachweise-und-aufzeichnungen","group":"ueberwachungsgrenzen","de":"Löschfrist für Nachweise und Aufzeichnungen","en":"Deletion deadline for proof and recordings","expl_de":"Vorher festgelegt, wann Fotos, Videos und Protokolle gelöscht werden.","expl_en":"Agreed in advance when photos, videos and logs get deleted.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/gesundheitsdaten-nur-auf-eigenen-geraeten","group":"ueberwachungsgrenzen","de":"Gesundheitsdaten nur auf eigenen Geräten","en":"Health data on your own devices only","expl_de":"Sie gehen nicht an fremde Anbieter.","expl_en":"It is not handed to outside providers.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/private-gesundheits-und-versicherungskonten","group":"ueberwachungsgrenzen","de":"Private Gesundheits- und Versicherungskonten","en":"Private health and insurance accounts","expl_de":"Kein Zugang zu Patientenportalen, Versicherungskonten oder Befunden.","expl_en":"No access to patient portals, insurance accounts or medical findings.","ap":true,"level":"s","risk":null,"scale":null},{"id":"gesundheit-selbstbestimmung/auszeit-bei-krankheit-oder-belastung","group":"auszeit","de":"Auszeit bei Krankheit oder Belastung","en":"Time out when ill or under strain","expl_de":"Die Begleitung pausiert, ohne dass das als Rückfall zählt.","expl_en":"The coaching pauses, and that does not count as a relapse.","ap":true,"level":"s","risk":null,"scale":null}],"dropped":[]},"sicherheit-verhandlung":{"items":[{"id":"sicherheit-verhandlung/vorbesprechung-fuehren","group":"verhandlung","de":"Vorbesprechung führen","en":"Holding a negotiation","expl_de":"Das Gespräch vor der Szene, in dem Wünsche, Grenzen und Ablauf geklärt werden.","expl_en":"The conversation before a scene in which wishes, limits and the plan are settled.","ap":false,"level":"e","risk":null,"scale":null},{"id":"sicherheit-verhandlung/aktivitaetsliste-vorher-festlegen","group":"verhandlung","de":"Aktivitätsliste vorher festlegen","en":"Agreeing an activity list beforehand","expl_de":"Eine konkrete Liste dessen, was vorkommen darf. Alles andere bleibt draußen.","expl_en":"A concrete list of what may happen. Anything else stays out.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/hard-limits-benennen","group":"verhandlung","de":"Hard Limits benennen","en":"Naming hard limits","expl_de":"Beide sagen vorher, was unter keinen Umständen stattfindet.","expl_en":"Both say beforehand what does not happen under any circumstances.","ap":false,"level":"e","risk":null,"scale":null},{"id":"sicherheit-verhandlung/soft-limits-benennen","group":"verhandlung","de":"Soft Limits benennen","en":"Naming soft limits","expl_de":"Beide sagen vorher, was nur unter Bedingungen möglich ist.","expl_en":"Both say beforehand what is possible only under conditions.","ap":false,"level":"e","risk":null,"scale":null},{"id":"sicherheit-verhandlung/trigger-vorher-benennen","group":"verhandlung","de":"Trigger vorher benennen","en":"Naming triggers beforehand","expl_de":"Vor der Szene wird ausgetauscht, was eine starke unwillkürliche Reaktion auslösen kann, damit es vermieden werden kann.","expl_en":"Before the scene you exchange what can set off a strong involuntary reaction, so it can be avoided.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/medizinische-besonderheiten-besprechen","group":"gesundheit","de":"Medizinische Besonderheiten besprechen","en":"Discuss medical conditions","expl_de":"Vorerkrankungen, Operationen oder Einschränkungen, die im Spiel eine Rolle spielen.","expl_en":"Prior conditions, surgeries or limitations that matter during play.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/allergien-besprechen","group":"gesundheit","de":"Allergien besprechen","en":"Discuss allergies","expl_de":"Latex, Metalle, Öle, Duftstoffe, Lebensmittel: alles, was Kontakt hat.","expl_en":"Latex, metals, oils, fragrances, food: anything that comes into contact.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/medikamente-besprechen","group":"gesundheit","de":"Medikamente besprechen","en":"Discuss medication","expl_de":"Was eingenommen wird und wie es auf Kreislauf, Schmerzempfinden oder Wachheit wirkt.","expl_en":"What is being taken and how it affects circulation, pain perception or alertness.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/mobilitaets-oder-kreislaufprobleme-besprechen","group":"gesundheit","de":"Mobilitäts- oder Kreislaufprobleme besprechen","en":"Discuss mobility or circulation problems","expl_de":"Gelenke, Rücken, Kreislauf: was an Haltung und Dauer machbar ist.","expl_en":"Joints, back, circulation: what is feasible in terms of position and duration.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/psychische-belastungen-besprechen","group":"gesundheit","de":"Psychische Belastungen besprechen","en":"Discuss mental health strain","expl_de":"Belastungen, die eine Szene auslösen oder verstärken könnte.","expl_en":"Strains that a scene could trigger or intensify.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/safeword-vereinbaren","group":"stoppsignale","de":"Safeword vereinbaren","en":"Agreeing a safeword","expl_de":"Ein Wort, das die Szene sofort beendet, ohne Nachfrage.","expl_en":"A word that ends the scene immediately, no questions asked.","ap":false,"level":"e","risk":null,"scale":null},{"id":"sicherheit-verhandlung/ampelsystem-vereinbaren","group":"stoppsignale","de":"Ampelsystem vereinbaren","en":"Agreeing a traffic light system","expl_de":"Grün heißt weiter, Gelb heißt langsamer oder nachfragen, Rot beendet alles sofort.","expl_en":"Green keeps going, yellow means slow down or check in, red stops everything at once.","ap":false,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/nonverbales-abbruchsignal-vereinbaren","group":"stoppsignale","de":"Nonverbales Abbruchsignal vereinbaren","en":"Agreeing a non-verbal stop signal","expl_de":"Ein Zeichen für den Fall, dass Sprechen nicht möglich ist, etwa ein fallengelassener Gegenstand.","expl_en":"A sign for when speaking is not possible, such as dropping an object.","ap":false,"level":"e","risk":null,"scale":null},{"id":"sicherheit-verhandlung/waehrend-der-szene-nachfragen","group":"stoppsignale","de":"Während der Szene nachfragen","en":"Checking in during the scene","expl_de":"Kurze Nachfragen mitten in der Szene, wie es gerade geht.","expl_en":"Brief questions during the scene about how it is going.","ap":false,"level":"e","risk":null,"scale":null},{"id":"sicherheit-verhandlung/aftercare-vorher-besprechen","group":"notfall","de":"Aftercare vorher besprechen","en":"Agreeing aftercare beforehand","expl_de":"Vorher klären, was danach gebraucht wird, statt es im Zustand danach herauszufinden.","expl_en":"Settle in advance what is needed afterwards, rather than working it out while coming down.","ap":false,"level":"e","risk":null,"scale":null},{"id":"sicherheit-verhandlung/notfallkontakt-benennen","group":"notfall","de":"Notfallkontakt benennen","en":"Naming an emergency contact","expl_de":"Eine Person, die im Notfall erreichbar ist und weiß, was zu tun ist.","expl_en":"Someone reachable in an emergency who knows what to do.","ap":true,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/erste-hilfe-material-bereithalten","group":"notfall","de":"Erste-Hilfe-Material bereithalten","en":"Keeping first aid supplies ready","expl_de":"Verbandmaterial und Desinfektion griffbereit, nicht im Keller.","expl_en":"Dressings and disinfectant within reach, not in the basement.","ap":true,"level":"s","risk":null,"scale":null},{"id":"sicherheit-verhandlung/telefon-in-reichweite","group":"notfall","de":"Telefon in Rei
