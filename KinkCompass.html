:"neckerei","de":"Spott","en":"Mockery","expl_de":"Über jemanden lachen, im vereinbarten Rahmen.","expl_en":"Laughing at someone, within the agreed frame.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/teasing","group":"neckerei","de":"Teasing","en":"Teasing","expl_de":"Necken, das Spannung aufbaut statt herabsetzt.","expl_en":"Teasing that builds tension rather than putting down.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/koerperbezogene-komplimente","group":"koerper-leistung","de":"Körperbezogene Komplimente","en":"Compliments about the body","expl_de":"Anerkennung für das Aussehen.","expl_en":"Recognition for how someone looks.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/koerperbezogene-demuetigung","group":"koerper-leistung","de":"Körperbezogene Demütigung","en":"Body-based humiliation","expl_de":"Trifft besonders tief und wirkt oft über die Szene hinaus. Gehört genau vereinbart.","expl_en":"This lands especially deep and often carries beyond the scene. It needs precise agreement.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/leistungsbezogene-demuetigung-als-rollenspiel","group":"koerper-leistung","de":"Leistungsbezogene Demütigung als Rollenspiel","en":"Performance-based humiliation as role play","expl_de":"Herabsetzung für Können oder Versagen, klar gerahmt.","expl_en":"Degradation about ability or failure, clearly framed.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/sexuelle-unerfahrenheit-als-rollenspielthema","group":"koerper-leistung","de":"Sexuelle Unerfahrenheit als Rollenspielthema","en":"Sexual inexperience as a role play theme","expl_de":"Unwissenheit als Motiv der Szene.","expl_en":"Not knowing as the scene's motif.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/sexuelle-unersaettlichkeit-als-rollenspielthema","group":"koerper-leistung","de":"Sexuelle Unersättlichkeit als Rollenspielthema","en":"Insatiability as a role play theme","expl_de":"Zu viel Verlangen als Motiv der Szene.","expl_en":"Too much desire as the scene's motif.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/kontrollverlust-kommentieren","group":"blossstellung","de":"Kontrollverlust kommentieren","en":"Commenting on loss of control","expl_de":"Die eigene Reaktion wird benannt.","expl_en":"Your own reaction gets named out loud.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/erroeten-oder-verlegenheit-provozieren","group":"blossstellung","de":"Erröten oder Verlegenheit provozieren","en":"Provoking blushing or embarrassment","expl_de":"Verlegenheit als gewünschte Wirkung.","expl_en":"Embarrassment as the wanted effect.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/vorlesen-peinlicher-selbst-formulierter-texte","group":"blossstellung","de":"Vorlesen peinlicher, selbst formulierter Texte","en":"Reading out embarrassing texts you wrote yourself","expl_de":"Eigene Worte werden zur Bloßstellung.","expl_en":"Your own words become the exposure.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/gestaendnisse-im-rollenspiel","group":"blossstellung","de":"Geständnisse im Rollenspiel","en":"Confessions in role play","expl_de":"Inszeniertes Beichten, nicht echtes Offenlegen.","expl_en":"Staged confession rather than real disclosure.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/bewertung-oder-benotung","group":"blossstellung","de":"Bewertung oder Benotung","en":"Grading or scoring","expl_de":"Leistung wird bewertet, oft mit Zahl oder Note.","expl_en":"Performance is graded, often with a score.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/objektstatus-im-rollenspiel","group":"blossstellung","de":"Objektstatus im Rollenspiel","en":"Being treated as an object in role play","expl_de":"Wie ein Gegenstand behandelt werden.","expl_en":"Being treated like a thing.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/ignorieren-als-kurzes-szenenelement","group":"ignorieren-bitte","de":"Ignorieren als kurzes Szenenelement","en":"Being ignored, as a brief scene element","expl_de":"Kurzes Nichtbeachten, klar begrenzt.","expl_en":"Being briefly disregarded, clearly limited.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/silent-treatment","group":"ignorieren-bitte","de":"Silent Treatment","en":"Silent treatment","expl_de":"Schweigen als Mittel, klar begrenzt. Außerhalb der Szene ein Beziehungsproblem, kein Spiel.","expl_en":"Silence as a device, clearly limited. Outside the scene it is a relationship problem, not play.","ap":true,"level":"v","risk":null,"scale":null},{"id":"verbale-dominanz/dankbarkeit-verlangen","group":"ignorieren-bitte","de":"Dankbarkeit verlangen","en":"Demanding gratitude","expl_de":"Danken als vorgeschriebene Reaktion.","expl_en":"Thanking as a prescribed response.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/um-vergebung-bitten","group":"ignorieren-bitte","de":"Um Vergebung bitten","en":"Asking forgiveness","expl_de":"Entschuldigung als Teil des Ablaufs.","expl_en":"Apology as part of the sequence.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/entschuldigung-ritualisieren","group":"ignorieren-bitte","de":"Entschuldigung ritualisieren","en":"Ritualised apology","expl_de":"Eine feste Form für das Entschuldigen.","expl_en":"A set form for apologising.","ap":true,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/oeffentlich-wirkende-demuetigung","group":"rahmen-demuetigung","de":"Öffentlich wirkende Demütigung","en":"Publicly framed humiliation","expl_de":"Es soll öffentlich wirken, findet aber privat statt.","expl_en":"It is meant to feel public but happens in private.","ap":false,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/demuetigung-vor-eingeweihten-zustimmenden-erwachsenen","group":"rahmen-demuetigung","de":"Demütigung vor eingeweihten, zustimmenden Erwachsenen","en":"Humiliation in front of consenting adults who are in on it","expl_de":"Alle Anwesenden haben zugestimmt.","expl_en":"Everyone present has agreed.","ap":false,"level":"s","risk":null,"scale":null},{"id":"verbale-dominanz/demuetigung-endet-mit-der-szene","group":"rahmen-demuetigung","de":"Demütigung endet mit der Szene","en":"Humiliation ends with the scene","expl_de":"Was in der Szene gesagt wird, gilt danach ausdrücklich nicht.","expl_en":"What is said in the scene expressly does not apply afterwards.","ap":false,"level":"s","risk":null,"scale":null}],"dropped":[]},"psychologisches-fear":{"items":[{"id":"psychologisches-fear/erwartungsspannung","group":"spannung","de":"Erwartungsspannung","en":"Anticipation","expl_de":"Die Spannung vor etwas wirkt stärker als das Ereignis.","expl_en":"The tension before something works more strongly than the event.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/countdown","group":"spannung","de":"Countdown","en":"Countdown","expl_de":"Ein angesagtes Herunterzählen, das Druck aufbaut.","expl_en":"An announced count-down that builds pressure.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/ungewissheit","group":"spannung","de":"Ungewissheit","en":"Uncertainty","expl_de":"Du weißt nicht, was kommt — der Rahmen steht aber vorher fest.","expl_en":"You do not know what is coming, though the frame is settled beforehand.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/ueberraschung-aus-der-aktivitaetsliste","group":"spannung","de":"Überraschung aus der Aktivitätsliste","en":"Surprise from the activity list","expl_de":"Überraschen darf nur, was vorher freigegeben wurde.","expl_en":"Only what was released beforehand may come as a surprise.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/kontrollverlust-fantasie","group":"gefangenschaft","de":"Kontrollverlust-Fantasie","en":"Fantasy of losing control","expl_de":"Die Vorstellung, nichts mehr in der Hand zu haben.","expl_en":"The idea of no longer being in charge.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/verhoer-rollenspiel","group":"gefangenschaft","de":"Verhör-Rollenspiel","en":"Interrogation role play","expl_de":"Eine Befragungssituation als Szene.","expl_en":"An interrogation situation as a scene.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/gefangenen-rollenspiel","group":"gefangenschaft","de":"Gefangenen-Rollenspiel","en":"Prisoner role play","expl_de":"Gefangenschaft als Rahmen.","expl_en":"Captivity as the frame.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/entfuehrungs-rollenspiel","group":"gefangenschaft","de":"Entführungs-Rollenspiel","en":"Abduction role play","expl_de":"Vollständig inszeniert und vorher verhandelt; nie eine echte Überraschung.","expl_en":"Entirely staged and negotiated in advance; never a real surprise.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/kidnapping-fantasie","group":"gefangenschaft","de":"Kidnapping-Fantasie","en":"Kidnapping fantasy","expl_de":"Bleibt Fantasie oder Inszenierung; Unbeteiligte kommen nie vor.","expl_en":"Stays fantasy or staging; nobody uninvolved is ever part of it.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/erpressungs-rollenspiel","group":"gefangenschaft","de":"Erpressungs-Rollenspiel","en":"Blackmail role play","expl_de":"Gespielt, ohne dass echtes kompromittierendes Material im Spiel ist.","expl_en":"Played out with no genuinely compromising material involved.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"psychologisches-fear/blackmail-fantasie-mit-drehbuch","group":"gefangenschaft","de":"Blackmail-Fantasie mit Drehbuch","en":"Blackmail fantasy with a script","expl_de":"Der Ablauf steht vorher fest, damit nichts eskaliert.","expl_en":"The course is fixed beforehand so nothing escalates.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"psychologisches-fear/bedrohliche-sprache","group":"bedrohung-horror","de":"Bedrohliche Sprache","en":"Threatening language","expl_de":"Der Ton droht, die Absicht nicht.","expl_en":"The tone threatens, the intent does not.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/stalking-fantasie","group":"bedrohung-horror","de":"Stalking-Fantasie","en":"Stalking fantasy","expl_de":"Eng begrenzt und ausschließlich zwischen Beteiligten.","expl_en":"Tightly limited and strictly between those involved.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"psychologisches-fear/jagd-und-verfolgungsspiel","group":"bedrohung-horror","de":"Jagd- und Verfolgungsspiel","en":"Chase and pursuit play","expl_de":"Jagen und Gejagtwerden an einem Ort, der dafür hergerichtet ist.","expl_en":"Chasing and being chased in a place prepared for it.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/horror-szenario","group":"bedrohung-horror","de":"Horror-Szenario","en":"Horror scenario","expl_de":"Eine Szene mit Horror-Ästhetik.","expl_en":"A scene with a horror aesthetic.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/monster-rollenspiel","group":"bedrohung-horror","de":"Monster-Rollenspiel","en":"Monster role play","expl_de":"Eine nichtmenschliche, bedrohliche Figur.","expl_en":"A non-human, threatening character.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/uebernatuerliches-rollenspiel","group":"bedrohung-horror","de":"Übernatürliches Rollenspiel","en":"Supernatural role play","expl_de":"Übernatürliche Wesen oder Kräfte als Motiv.","expl_en":"Supernatural beings or powers as the motif.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/pruefungssituation","group":"autoritaet","de":"Prüfungssituation","en":"Examination scenario","expl_de":"Geprüft und bewertet werden als Szene.","expl_en":"Being tested and judged as a scene.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/autoritaetsgefaelle","group":"autoritaet","de":"Autoritätsgefälle","en":"Authority gap","expl_de":"Eine Figur mit Amt oder Rang gegenüber einer ohne.","expl_en":"A character with office or rank facing one without.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/kulisse-und-requisiten","group":"autoritaet","de":"Kulisse und Requisiten","en":"Set dressing and props","expl_de":"Verhörlampe, Geräusche, Einrichtung — alles, was die Atmosphäre trägt.","expl_en":"Interrogation lamp, sounds, furnishings: whatever carries the atmosphere.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/fake-punishment","group":"autoritaet","de":"Fake Punishment","en":"Fake punishment","expl_de":"Die Strafe wird angekündigt, aber nie ausgeführt. Die Ankündigung tut die Arbeit.","expl_en":"The punishment is announced but never carried out. The announcement does the work.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/mindfuck","group":"autoritaet","de":"Mindfuck","en":"Mindfuck","expl_de":"Gezielte Verwirrung — nur in Bereichen, die vorher freigegeben wurden.","expl_en":"Deliberate disorientation, only in areas released beforehand.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/hypnose-als-rollenspiel","group":"hypnose-kontrolle","de":"Hypnose als Rollenspiel","en":"Hypnosis as role play","expl_de":"Hypnose wird gespielt, nicht tatsächlich herbeigeführt.","expl_en":"Hypnosis is acted rather than actually induced.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/tatsaechliche-hypnose","group":"hypnose-kontrolle","de":"Tatsächliche Hypnose","en":"Actual hypnosis","expl_de":"Echte Trance. Suggestionen können nachwirken, deshalb gehört das in geübte Hände.","expl_en":"Real trance. Suggestions can linger, so this belongs in practised hands.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"psychologisches-fear/gespielter-gedaechtnisverlust","group":"hypnose-kontrolle","de":"Gespielter Gedächtnisverlust","en":"Played memory loss","expl_de":"Vergessen als Rollenspielelement, nicht als Zustand.","expl_en":"Forgetting as a role play element, not as a state.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/rausch-als-thema","group":"hypnose-kontrolle","de":"Rausch als Thema","en":"Intoxication as a theme","expl_de":"Das Thema wird gespielt; tatsächlich ist niemand berauscht.","expl_en":"The theme is played out; in fact nobody is intoxicated.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/abandonment-fantasie-ohne-reales-zuruecklassen-in-gefahr","group":"mutproben","de":"Abandonment-Fantasie ohne reales Zurücklassen in Gefahr","en":"Abandonment fantasy, never leaving anyone in real danger","expl_de":"Das Gefühl des Verlassenwerdens ohne tatsächliche Gefahr.","expl_en":"The feeling of being left without any real danger.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/pruefung-der-selbstbeherrschung","group":"mutproben","de":"Prüfung der Selbstbeherrschung","en":"Testing self-control","expl_de":"Aushalten, ohne zu reagieren.","expl_en":"Enduring without reacting.","ap":true,"level":"v","risk":null,"scale":null},{"id":"psychologisches-fear/peinliche-aufgaben-im-privaten-rahmen","group":"mutproben","de":"Peinliche Aufgaben im privaten Rahmen","en":"Embarrassing tasks in private","expl_de":"Aufgaben, die verlegen machen, ohne Dritte.","expl_en":"Tasks that cause embarrassment, with nobody else involved.","ap":true,"level":"s","risk":null,"scale":null},{"id":"psychologisches-fear/mutproben-ohne-erhebliche-gefahr","group":"mutproben","de":"Mutproben ohne erhebliche Gefahr","en":"Dares without serious danger","expl_de":"Herausforderungen ohne echtes Risiko.","expl_en":"Challenges without real risk.","ap":true,"level":"v","risk":null,"scale":null}],"dropped":[]},"manipulation-spielmittel":{"items":[{"id":"manipulation-spielmittel/gaslighting","group":"wahrnehmung","de":"Gaslighting","en":"Gaslighting","expl_de":"Die andere Person bestreitet, was du wahrgenommen hast, bis du an dir selbst zweifelst. Die wirksamste und schädlichste der Techniken, weil sie genau das angreift, womit du prüfen würdest, ob etwas stimmt.","expl_en":"The other person denies what you perceived until you doubt yourself. The most effective and most damaging of these techniques, because it attacks the very thing you would use to check whether something is wrong.","ap":true,"level":"s","risk":"hoch","scale":null},{"id":"manipulation-spielmittel/bestrittene-erinnerung","group":"wahrnehmung","de":"Bestrittene Erinnerung","en":"Disputed memory","expl_de":"Details des Geschehenen werden anders dargestellt, als du sie erinnerst.","expl_en":"Details of what happened are presented differently from how you remember them.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/widerspruechliche-darstellung","group":"wahrnehmung","de":"Widersprüchliche Darstellung","en":"Contradictory accounts","expl_de":"Dieselbe Sache wird nacheinander verschieden geschildert, bis die eigene Version unsicher wird.","expl_en":"The same thing is described differently over time, until your own version feels uncertain.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/gedankenstopp-formel","group":"wahrnehmung","de":"Gedankenstopp-Formel","en":"Thought-stopping phrase","expl_de":"Eine feste Formel beendet jeden aufkommenden Zweifel, statt ihn zu beantworten.","expl_en":"A set phrase ends any doubt that arises, instead of answering it.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/intermittierende-verstaerkung","group":"bindung","de":"Intermittierende Verstärkung","en":"Intermittent reinforcement","expl_de":"Lob und Entzug wechseln unberechenbar. Der psychologische Kern der Bindung an missbräuchliche Beziehungen — er wirkt stärker als verlässliche Zuwendung und wirkt auch dann, wenn man ihn durchschaut.","expl_en":"Praise and withdrawal alternate unpredictably. The psychological core of attachment in abusive relationships: it binds more strongly than reliable affection, and it works even when you see it coming.","ap":true,"level":"s","risk":"hoch","scale":null},{"id":"manipulation-spielmittel/love-bombing","group":"bindung","de":"Love Bombing","en":"Love bombing","expl_de":"Überwältigende Zuwendung zu Beginn, die einen Maßstab setzt, hinter den später alles zurückfällt.","expl_en":"Overwhelming affection at the start, setting a standard that everything later falls short of.","ap":true,"level":"s","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/idealisierung-und-abwertung-im-wechsel","group":"bindung","de":"Idealisierung und Abwertung im Wechsel","en":"Idealisation and devaluation in cycles","expl_de":"Der Wechsel zwischen Erhebung und Herabsetzung als wiederkehrendes Muster.","expl_en":"The alternation between elevation and belittlement as a recurring pattern.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/hoovering","group":"bindung","de":"Hoovering","en":"Hoovering","expl_de":"Zurückgeholt werden, sobald Distanz entsteht — mit Zuwendung, Versprechen oder Krise.","expl_en":"Being pulled back in as soon as distance appears, with affection, promises or a crisis.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/breadcrumbing","group":"bindung","de":"Breadcrumbing","en":"Breadcrumbing","expl_de":"Gerade so viel Zuwendung, dass die Hoffnung bleibt, und nie genug, dass sie sich erfüllt.","expl_en":"Just enough attention to keep hope alive, never enough to fulfil it.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/future-faking","group":"bindung","de":"Future Faking","en":"Future faking","expl_de":"Versprechen auf eine gemeinsame Zukunft, die nie eintritt, aber die Gegenwart erträglich macht.","expl_en":"Promises about a shared future that never arrives but makes the present bearable.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/verschobene-massstaebe","group":"massstaebe","de":"Verschobene Maßstäbe","en":"Shifting standards","expl_de":"Sobald du die Anforderung erfüllst, verschiebt sie sich. Erzeugt erlernte Hilflosigkeit — man hört auf, es zu versuchen.","expl_en":"As soon as you meet the requirement, it moves. This produces learned helplessness: you stop trying.","ap":true,"level":"s","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/eingebautes-scheitern","group":"massstaebe","de":"Eingebautes Scheitern","en":"Built-in failure","expl_de":"Die Aufgabe ist so gestellt, dass sie nicht zu erfüllen ist, und das Scheitern ist der Zweck.","expl_en":"The task is set so that it cannot be met, and the failure is the point.","ap":true,"level":"s","risk":null,"scale":null},{"id":"manipulation-spielmittel/unerfuellbarer-massstab","group":"massstaebe","de":"Unerfüllbarer Maßstab","en":"Unreachable standard","expl_de":"Ein Maßstab, den niemand erreichen kann, als dauerhafter Grund für Korrektur.","expl_en":"A standard nobody can reach, used as a standing reason for correction.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/wechselnde-bewertungskriterien","group":"massstaebe","de":"Wechselnde Bewertungskriterien","en":"Shifting criteria","expl_de":"Bewertet wird nach Maßstäben, die sich ändern und nicht vorher genannt werden.","expl_en":"You are judged by criteria that change and are not stated in advance.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/triangulation","group":"dritte","de":"Triangulation","en":"Triangulation","expl_de":"Eine dritte Person wird als Vergleich, Rivale oder Bündnispartner ins Spiel gebracht. Setzt voraus, dass diese Person eingeweiht ist und zugestimmt hat.","expl_en":"A third person is brought in as a comparison, rival or ally. This requires that they know about it and have agreed.","ap":true,"level":"s","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/gezielt-erzeugte-eifersucht","group":"dritte","de":"Gezielt erzeugte Eifersucht","en":"Deliberately provoked jealousy","expl_de":"Eifersucht wird gezielt hergestellt statt vermieden.","expl_en":"Jealousy is deliberately produced rather than avoided.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/rangordnung-unter-beteiligten","group":"dritte","de":"Rangordnung unter Beteiligten","en":"Ranking among those involved","expl_de":"Eine ausgesprochene Rangfolge zwischen mehreren Beteiligten.","expl_en":"An explicit order of rank between several people involved.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/dritte-ueben-druck-aus","group":"dritte","de":"Dritte üben Druck aus","en":"Third parties apply pressure","expl_de":"Andere werden eingesetzt, um Druck aufzubauen. Nur mit deren Wissen und Zustimmung.","expl_en":"Others are used to build pressure. Only with their knowledge and consent.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/eigene-gruppensprache","group":"gruppe","de":"Eigene Gruppensprache","en":"Loaded group language","expl_de":"Eine eigene Sprache, in der bestimmte Worte jede weitere Frage beenden. Lifton nennt das den Kern des Denkabbruchs in Hochkontroll-Gruppen.","expl_en":"A vocabulary of your own in which certain words end any further question. Lifton describes this as the core mechanism of thought-stopping in high-control groups.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/kontrollierte-informationsumgebung","group":"gruppe","de":"Kontrollierte Informationsumgebung","en":"Controlled information environment","expl_de":"Was du erfährst, wird gesteuert. Ohne Gegenquelle lässt sich nichts mehr prüfen — deshalb besonders heikel.","expl_en":"What reaches you is controlled. Without an outside source nothing can be checked, which is what makes this especially delicate.","ap":true,"level":"v","risk":"hoch","scale":null},{"id":"manipulation-spielmittel/oeffentliches-bekenntnis-vor-der-gruppe","group":"gruppe","de":"Öffentliches Bekenntnis vor der Gruppe","en":"Public confession before the group","expl_de":"Vor anderen aussprechen, was man falsch gemacht hat.","expl_en":"Saying in front of others what you did wrong.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/beichte-die-spaeter-verwendet-wird","group":"gruppe","de":"Beichte, die später verwendet wird","en":"Confession used later","expl_de":"Was du preisgibst, wird später gegen dich verwendet. Genau dieser Mechanismus macht aus einer Beichte ein Druckmittel.","expl_en":"What you disclose is later used against you. That mechanism is what turns a confession into leverage.","ap":true,"level":"v","risk":"hoch","scale":null},{"id":"manipulation-spielmittel/zugehoerigkeit-als-belohnung","group":"gruppe","de":"Zugehörigkeit als Belohnung","en":"Belonging as a reward","expl_de":"Dazuzugehören wird verdient, nicht vorausgesetzt.","expl_en":"Belonging is earned rather than assumed.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/ausschluss-als-drohung","group":"gruppe","de":"Ausschluss als Drohung","en":"Exclusion as a threat","expl_de":"Der mögliche Ausschluss aus der Gruppe als Mittel der Führung.","expl_en":"The possibility of being excluded from the group, used as a means of control.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/die-regel-schlaegt-das-eigene-empfinden","group":"gruppe","de":"Die Regel schlägt das eigene Empfinden","en":"The rule overrides your own perception","expl_de":"Wenn dein Empfinden der Regel widerspricht, gilt die Regel. Bei Lifton „doctrine over person\" — der Punkt, an dem eine Dynamik aufhört, korrigierbar zu sein.","expl_en":"When your own perception contradicts the rule, the rule wins. Lifton's \"doctrine over person\": the point at which a dynamic stops being correctable.","ap":true,"level":"v","risk":"hoch","scale":null},{"id":"manipulation-spielmittel/zeitweise-abschirmung-von-aussen","group":"gruppe","de":"Zeitweise Abschirmung von außen","en":"Temporary shielding from the outside","expl_de":"Kontakt nach außen wird für eine vereinbarte Zeit unterbrochen. Isolation ist der Verstärker jeder anderen Technik auf dieser Liste.","expl_en":"Contact with the outside is cut for an agreed time. Isolation amplifies every other technique on this list.","ap":true,"level":"v","risk":"hoch","scale":null},{"id":"manipulation-spielmittel/kleine-zusage-als-einstieg","group":"verpflichtung","de":"Kleine Zusage als Einstieg","en":"A small yes as the way in","expl_de":"Eine harmlose Zusage zuerst, auf der weitere aufbauen.","expl_en":"An innocuous agreement first, with more built on top of it.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/eskalierende-selbstverpflichtung","group":"verpflichtung","de":"Eskalierende Selbstverpflichtung","en":"Escalating commitment","expl_de":"Jeder Schritt macht den nächsten kleiner erscheinen.","expl_en":"Each step makes the next one look smaller.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/das-investierte-als-argument","group":"verpflichtung","de":"Das Investierte als Argument","en":"The investment as an argument","expl_de":"Was schon investiert wurde, wird zum Grund, weiterzumachen.","expl_en":"What has already been invested becomes the reason to continue.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/kuenstliche-dringlichkeit","group":"verpflichtung","de":"Künstliche Dringlichkeit","en":"Manufactured urgency","expl_de":"Zeitdruck, den es sachlich nicht gibt.","expl_en":"Time pressure that does not objectively exist.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/scheinwahl-zwischen-zwei-optionen","group":"verpflichtung","de":"Scheinwahl zwischen zwei Optionen","en":"A false choice","expl_de":"Zwei Optionen zur Wahl, beide von der anderen Seite gesetzt.","expl_en":"Two options to choose from, both set by the other side.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/good-cop-bad-cop","group":"verpflichtung","de":"Good Cop / Bad Cop","en":"Good cop / bad cop","expl_de":"Zwei Personen teilen sich Härte und Milde auf.","expl_en":"Two people divide harshness and leniency between them.","ap":true,"level":"v","risk":null,"scale":null},{"id":"manipulation-spielmittel/schuldumkehr","group":"verpflichtung","de":"Schuldumkehr","en":"Reversal of blame","expl_de":"Der Vorwurf wird umgedreht: wer sich beschwert, steht plötzlich selbst in der Kritik. In der Literatur DARVO genannt.","expl_en":"The complaint is turned around: whoever objects suddenly finds themselves criticised. Known in the literature as DARVO.","ap":true,"level":"v","risk":"mittel","scale":null},{"id":"manipulation-spielmittel/techniken-vorher-benennen","group":"grenzen-manipulation","de":"Techniken vorher benennen","en":"Naming the techniques beforehand","expl_de":"Welche Techniken vorkommen dürfen, steht vorher fest. Überraschung darf die Auswahl betreffen, nicht den Katalog.","expl_en":"Which techniques may appear is settled beforehand. Surprise may concern the selection, not the catalogue.","ap":false,"level":"s","risk":null,"scale":null},{"id":"manipulation-spielmittel/einsatz-endet-mit-der-szene","group":"grenzen-manipulation","de":"Einsatz endet mit der Szene","en":"Use ends with the scene","expl_de":"Außerhalb der Szene kommt nichts davon vor, auch nicht andeutungsweise.","expl_en":"Outside the scene none of it occurs, not even as a hint.","ap":false,"level":"s","risk":null,"scale":null},{"id":"manipulation-spielmittel/debrief-nach-jeder-szene","group":"grenzen-manipulation","de":"Debrief nach jeder Szene","en":"A debrief after every scene","expl_de":"Weil ein Safeword hier nicht ausreicht, ist das Gespräch danach der eigentliche Schutz.","expl_en":"Because a safeword is not enough here, the conversation afterwards is the actual safeguard.","ap":false,"level":"s","risk":null,"scale":null},{"id":"manipulation-spielmittel/nachwirkung-nach-tagen-besprechen","group":"grenzen-manipulation","de":"Nachwirkung nach Tagen besprechen","en":"Talking about the after-effects days later","expl_de":"Diese Techniken wirken verzögert. Ein zweites Gespräch nach einigen Tagen fängt auf, was direkt danach noch nicht sichtbar war.","expl_en":"These techniques act with a delay. A second conversation after a few days catches what was not yet visible right afterwards.","ap":false,"level":"s","risk":null,"scale":null},{"id":"manipulation-spielmittel/aussenstehende-person-kennt-den-rahmen","group":"grenzen-manipulation","de":"Außenstehende Person kennt den Rahmen","en":"Someone outside knows the framework","expl_de":"Jemand außerhalb der Dynamik weiß, was vereinbart ist, und lässt sich ansprechen.","expl_en":"Someone outside the dynamic knows what has been agreed and can be approached.","ap":false,"level":"s","risk":null,"scale":null},{"id":"manipulation-spielmittel/aussetzen-bei-psychischer-belastung","group":"grenzen-manipulation","de":"Aussetzen bei psychischer Belastung","en":"Pausing when under strain","expl_de":"Bei psychischer Belastung pausiert dieser Bereich, ohne Begründung.","expl_en":"When under psychological strain this area pauses, without needing a reason.","ap":false,"level":"s","risk":null,"scale":null}],"dropped":[]},"blackmail-blossstellung":{"items":[{"id":"blackmail-blossstellung/ohne-material","group":"material","de":"Reine Fiktion ohne Material","en":"Pure fiction, nothing held","expl_de":"Es gibt kein Material };
const L=(o)=>ST.lang==='en'?(o.en||o.de):o.de;
const LB=(x)=>ST.lang==='en'?(x.en||x.de):x.de;   /* fuer Items/Sektionen */
const scLbl=(kind,v)=>{const s=(SC[kind]||DATA.tree.choices[kind]||[]).find(o=>o.v===v);
  return s?(ST.lang==='en'?(s.en||s.label_en||s.de||s.label_de):(s.de||s.label_de)):v;};
const optsOf=(kind)=>SC[kind]||(DATA.tree.choices[kind]||[]).map(o=>
  ({v:o.v,de:o.label_de,en:o.label_en,dde:o.desc_de,den:o.desc_en}));
const hasDesc=(opts)=>opts.some(o=>o.dde||o.den);

/* ---------- Index ---------- */
const IDX={items:[],byId:{},sec:{},theme:{},secOf:{}};
DATA.tree.themes.sort((a,b)=>a.order-b.order).forEach(t=>{
  IDX.theme[t.id]=t;
  t.sections.forEach(s=>{
    s.theme=t.id; s.exempt=!!t.exempt; IDX.sec[s.id]=s;
    s.items=(DATA.items[s.id]||{items:[]}).items;
    s.dropped=(DATA.items[s.id]||{}).dropped||[];
    s.items.forEach(it=>{
      it.sec=s.id; it.theme=t.id; it.exempt=s.exempt;
      it.kind=s.type==='scale'?'wunsch':s.type==='vereinbarung'?(it.scale||'vereinbarung'):s.type;
      /* Rollentrennung gilt jetzt auch im Vereinbarungsteil: dort entscheidet die
         Rolle ueber die Bedeutung („fuer mich brauche ich das nicht" ist etwas
         anderes als „ich gebe es dir nicht"). */
      const rollig=(s.type==='scale')||(it.kind==='vereinbarung');
      it.units=(rollig&&it.ap)?['#a','#p']:[''];

});
const THEMES=DATA.tree.themes;

/* ---------- Zustand ---------- */
const KEY='kinkcompass_v2';
/* Ein frischer Bogen startet im Einstieg. Wer die Datei zum ersten Mal oeffnet,
   hat sich nicht entschieden — und die beiden Fehlerfaelle sind ungleich: eine
   Anfaengerin, die in 891 Items landet, hoert auf; eine erfahrene Person
   schaltet oben in einem Klick um. Ein gespeicherter Bogen behaelt seinen Modus. */
const BLANK=()=>({v:APP.schema,lang:'de',mode:'e',meta:{},
  w:{},p:{},x:{},f:{},star:{},ag:{},tx:{},multi:{},notes:{},
  nodeW:{},nodeP:{},nodeF:{},skip:{},
  rank:[],secRank:{},toys:[],
  noExp:false,showP:false,showX:false,showSt:true,more:{},open:{},step:0});
let ST=BLANK();
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw);
  if(o&&typeof o==='object') ST=Object.assign(BLANK(),o);}}catch(e){}
/* Auf file:// koennen manche Browser localStorage sperren. Ein stiller Verlust
   eines ausgefuellten Bogens waere der schlimmste Fehlerfall — deshalb pruefen
   wir aktiv und sagen es, statt es zu verschlucken. */
let STORAGE_OK=true;
try{localStorage.setItem(KEY+'_probe','1'); localStorage.removeItem(KEY+'_probe');}
catch(e){STORAGE_OK=false;}
let saveT=null,saveFailed=false;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  try{localStorage.setItem(KEY,JSON.stringify(ST)); if(saveFailed){saveFailed=false;storageWarn();}}
  catch(e){ if(!saveFailed){saveFailed=true; STORAGE_OK=false; storageWarn(); } }},250);}
/* Hinweisband zu Fassungsunterschieden */
function versionNote(rep){
  const b=document.getElementById('versionwarn'); if(!b) return;
  const en=ST.lang==='en', parts=[];
  const msg=rep?migSummary(rep):'';
  if(msg) parts.push(msg);

  if(lf&&lf.listRev&&lf.listRev!==APP.listRev)
    parts.push((en?'The file was filled in against list revision '

      (en?'. Items added since then simply appear unanswered.'
        :'. Seither ergänzte Punkte erscheinen schlicht als unbeantwortet.'));
  if(lf&&lf.schema&&lf.schema>APP.schema)
    parts.push(en?'The file comes from a newer version of the tool. Some entries may not have been read.'
      :'Die Datei stammt aus einer neueren Fassung des Werkzeugs. Einzelne Angaben wurden möglicherweise nicht gelesen.');
  const orph=ST.orphans?Object.keys(ST.orphans).length:0;
  if(orph&&!msg) parts.push(orph+(en?' entries from older versions travel along unchanged.'
    :' Angaben aus älteren Fassungen werden unverändert mitgeführt.'));
  if(!parts.length){ b.style.display='none'; return; }
  b.style.display='block'; b.textContent=parts.join(' ');
}
function storageWarn(){
  const b=document.getElementById('storagewarn'); if(!b) return;
  if(STORAGE_OK){b.style.display='none'; return;}
  b.style.display='block';
  b.innerHTML=(ST.lang==='en'
    ?'<b>Autosave is not working in this browser.</b> Your entries are kept in memory only and '+
     'will be lost when you close the tab. Export as JSON or Markdown regularly — that always works.'
    :'<b>Die automatische Speicherung funktioniert in diesem Browser nicht.</b> Deine Eingaben '+
     'liegen nur im Arbeitsspeicher und gehen beim Schließen des Tabs verloren. Exportiere '+
     'regelmäßig als JSON oder Markdown — das funktioniert immer.');
}

/* ---------- Fassungswechsel ----------
   Aeltere Exporte muessen lesbar bleiben. Ids, die umbenannt wurden, werden
   umgeschrieben; Ids, die es nicht mehr gibt, werden NICHT weggeworfen, sondern
   als Waise mitgefuehrt und beim Export wieder mitgeschrieben. Stiller
   Datenverlust ist der schlimmere Fehler. */
const MIG=DATA.migrations||{}, MIGWHY=DATA.migrationReasons||{};
const hasMig=(id)=>Object.prototype.hasOwnProperty.call(MIG,id);
const migId=(id)=>hasMig(id)?MIG[id]:id;
function splitUnit(k){
  const role=/#[ap]$/.test(k)?k.slice(-2):'';
  return [role?k.slice(0,-2):k, role];
}
const ITEMSTORES=['w','p','x','f','star','ag','tx','notes','more'];
const NODESTORES=['nodeW','nodeP','nodeF','skip','open'];
function migrateState(st){
  const rep={renamed:0,removed:0,unknown:0,nodes:0,labels:[]};
  st.orphans=st.orphans||{};
  ITEMSTORES.forEach(name=>{
    const src=st[name]||{}, out={};
    Object.keys(src).forEach(k=>{
      const u=splitUnit(k), id=u[0], role=u[1];
      const n=migId(id);
      if(n===null){ rep.removed++; rep.labels.push(id);
        st.orphans[name+'|'+k]=src[k]; return; }
      if(n!==id) rep.renamed++;
      if(!IDX.byId[n]){ rep.unknown++; rep.labels.push(n);
        st.orphans[name+'|'+k]=src[k]; return; }
      out[n+role]=src[k];
    });
    st[name]=out;
  });
  NODESTORES.forEach(name=>{
    const src=st[name]||{}, out={};
    Object.keys(src).forEach(k=>{
      /* Knoten koennen ein Rollen-Suffix tragen: 'G:sek.gruppe#p' */
      const u=splitUnit(k), base=u[0], role=u[1];
      const n=migId(base);
      if(n===null||!nodeExists(n)){ rep.nodes++; return; }
      out[n+role]=src[k];
    });
    st[name]=out;
  });
  st.rank=(st.rank||[]).map(k=>{
    const u=splitUnit(k), n=migId(u[0]);
    return (n&&IDX.byId[n])?n+u[1]:null;}).filter(Boolean);
  const sr={};
  Object.keys(st.secRank||{}).forEach(k=>{
    const parts=k.split('|'), sid=parts[0];
    if(!IDX.sec[sid]) return;
    sr[k]=(st.secRank[k]||[]).map(x=>{
      const u=splitUnit(x), n=migId(u[0]);
      return (n&&IDX.byId[n])?n+u[1]:null;}).filter(Boolean);
  });
  st.secRank=sr;
  const mu={};
  Object.keys(st.multi||{}).forEach(sid=>{
    if(!IDX.sec[sid]) return;
    mu[sid]=(st.multi[sid]||[]).map(id=>{
      const n=migId(id); return (n&&IDX.byId[n])?n:null;}).filter(Boolean);
  });
  st.multi=mu;
  return rep;
}
function nodeExists(k){
  if(k.indexOf('T:')===0) return !!IDX.theme[k.slice(2)];
  if(k.indexOf('S:')===0) return !!IDX.sec[k.slice(2)];
  if(k.indexOf('G:')===0){
    const rest=k.slice(2), i=rest.indexOf('.'), sid=rest.slice(0,i), gid=rest.slice(i+1);
    return !!(IDX.sec[sid]&&IDX.sec[sid].groups.some(g=>g.id===gid));
  }
  return false;
}
function migSummary(rep){
  const en=ST.lang==='en', b=[];
  if(rep.renamed) b.push(rep.renamed+(en?' entries moved to their new item'
    :' Angaben auf ihren neuen Punkt umgezogen'));
  if(rep.removed) b.push(rep.removed+(en?' entries belong to items that no longer exist'
    :' Angaben gehören zu Punkten, die es nicht mehr gibt'));
  if(rep.unknown) b.push(rep.unknown+(en?' entries are unknown here — a newer version?'
    :' Angaben sind hier unbekannt — neuere Fassung?'));
  if(rep.nodes) b.push(rep.nodes+(en?' group ratings dropped'
    :' Bewertungen auf Gruppenebene entfallen'));
  if(!b.length) return '';
  return (en?'Loaded from an older version. ':'Aus einer älteren Fassung geladen. ')+
    b.join(' · ')+(rep.removed||rep.unknown
      ? (en?'. Nothing was deleted — they travel along and are written back on export.'
          :'. Gelöscht wurde nichts — sie werden mitgeführt und beim Export wieder mitgeschrieben.')
      : '.');
}

/* Vereinbarungen: rollenspezifischer Wert, sonst der rollenlose als Rueckfall.
   Damit bleiben Antworten aus Fassungen ohne Rollentrennung gueltig. */
function agOf(it,u){ return ST.ag[it.id+(u||'')]||ST.ag[it.id]||''; }
function agSet(it,u,v){
  const k=it.id+(u||'');
  if(v) ST.ag[k]=v; else delete ST.ag[k];
  if(u&&ST.ag[it.id]&&!ST.ag[it.id+'#a']&&!ST.ag[it.id+'#p']) return;
  if(u&&ST.ag[it.id]) delete ST.ag[it.id];
}
/* ---------- Vererbung ---------- */
const chainOf=(it)=>['G:'+it.sec+'.'+it.group,'S:'+it.sec,'T:'+it.theme];
function effOf(store,nodeStore,it,role){
  const k=it.id+(role||'');
  if(store[k]) return {v:store[k],src:'set'};
  if(it.exempt) return {v:null,src:null};
  for(const nk of chainOf(it)){
    /* Ein Haken am Themennamen ist die groebste Geste im ganzen Bogen. Im
       Einstieg ist sie sogar die einzige. Sie darf nicht stillschweigend
       „Ravishment-Fantasie" oder „Blut" mitbewerten: Praktiken mit Risiko-
       hinweis erbt man nicht von der Themenebene, die muessen benannt werden.
       Gruppen- und Sektionsebene bleiben moeglich — dort sieht man, worauf
       man den Haken setzt. */
    if((it.risk||it.nosweep)&&nk.charAt(0)==='T') continue;
    if(role&&nodeStore[nk+role]) return {v:nodeStore[nk+role],src:'inh',from:nk};
    if(nodeStore[nk]) return {v:nodeStore[nk],src:'inh',from:nk};
  }
  return {v:null,src:null};
}
const effW=(it,role)=>effOf(ST.w,ST.nodeW,it,role);
const effP=(it,role)=>effOf(ST.p,ST.nodeP,it,role);
const effF=(it)=>effOf(ST.f,ST.nodeF,it,'');
function isSkipped(it){
  if(it.exempt) return false;
  return chainOf(it).some(nk=>ST.skip[nk]);
}
const nodeSkipped=(nk)=>{
  if(ST.skip[nk]) return true;
  if(nk.startsWith('G:')){const s=nk.slice(2).split('.')[0];
    return !!(ST.skip['S:'+s]||ST.skip['T:'+IDX.sec[s].theme]);}
  if(nk.startsWith('S:')) return !!ST.skip['T:'+IDX.sec[nk.slice(2)].theme];
  return false;
};

/* ---------- Sichtbarkeit nach Modus ---------- */
const lvOK=(it)=>MODES[ST.mode].indexOf(it.level)>=0;
const visItems=(s)=>s.items.filter(lvOK);
const allItems=(t)=>[].concat.apply([],t.sections.map(s=>s.items));
const visOfTheme=(t)=>[].concat.apply([],t.sections.map(visItems));
/* Im Einstieg wird ein Bereich ohne eigene Einstiegsitems nur als Ganzes bewertet.
   Die Bewertung vererbt sich trotzdem auf alle Items — ein Einstiegsprofil bleibt
   deshalb mit einem ausfuehrlich ausgefuellten vergleichbar. */
const isEkat=(t)=>ST.mode==='e'&&!!t.ekat;
const themeShown=(t)=>visOfTheme(t).length>0||isEkat(t);
const inProgress=(it)=>['wunsch','vereinbarung','angabe','text'].indexOf(it.kind)>=0
  ||!!DATA.tree.choices[it.kind];

/* ---------- Fortschritt ---------- */
function countUnits(items){
  let set=0,clar=0,tot=0;
  items.forEach(it=>{
    if(!inProgress(it)) return;
    if(it.kind==='text'){tot++; if((ST.tx[it.id]||'').trim()){set++;clar++;} return;}
    if(it.kind==='wunsch'){
      it.units.forEach(u=>{tot++;const e=effW(it,u);
        if(e.src==='set'){set++;clar++;} else if(e.src==='inh'||isSkipped(it)) clar++;});
      return;
    }
    it.units.forEach(u=>{tot++; if(agOf(it,u)){set++;clar++;}});
  });
  return {set:set,clar:clar,tot:tot};
}
function updateProgress(){
  const vis=IDX.items.filter(it=>lvOK(it));
  const k=countUnits(vis.filter(it=>!it.exempt));
  const s=countUnits(vis.filter(it=>it.exempt));
  const put=(pre,o)=>{
    document.getElementById('pb'+pre+'S').style.width=(o.tot?100*o.set/o.tot:0)+'%';
    document.getElementById('pb'+pre+'C').style.width=(o.tot?100*o.clar/o.tot:0)+'%';
    document.getElementById('pi'+pre).textContent=
      o.set+' '+L(T.setCount)+' · '+o.clar+' '+L(T.clarCount)+' / '+o.tot;
  };
  put('Kink',k); put('Safe',s);
}

<script>
"use strict";
/* ==================== Rendering ==================== */
const el=(tag,cls,txt)=>{const n=document.createElement(tag);
  if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n;};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Sektionshinweise der Quelle enthalten **fett** und Fussnoten [^n] */
function mdInline(t){
  return esc(t)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(?:\[\^(\d+)\])+/g,(m)=>m.match(/\d+/g).map(n=>
      '<sup><a href="#ref-'+n+'" title="Quelle '+n+'">'+n+'</a></sup>').join(''));
}
function noteEl(txt){const d=el('div','secnote'); d.innerHTML=mdInline(txt); return d;}

function wunschOpts(){return ST.mode==='e'
  ? SC.wunsch.filter(o=>WUNSCH_E.indexOf(o.v)>=0) : SC.wunsch;}
const nodeIsAp=(items)=>items.length>0&&items.every(it=>it.ap&&it.kind==='wunsch');
const hasWunsch=(items)=>items.some(it=>it.kind==='wunsch');

/* ---------- Chip-Reihe ---------- */
function chipRow(opts,cur,onPick,roleLbl,inherited,blocked){
  const wrap=el('div','axrow');
  if(roleLbl!=null){const r=el('span','rlbl',roleLbl);wrap.appendChild(r);}
  opts.forEach(o=>{
    const c=el('button','chip',LB(o));
    c.type='button'; c.dataset.v=o.v;
    c.title=(o.dde||o.den)?LB({de:o.dde,en:o.den}):'';
    if(blocked&&blocked.indexOf(o.v)>=0){c.classList.add('blocked');
      c.title=L(T.hardBlocks); c.onclick=()=>{};}
    else c.onclick=()=>onPick(cur===o.v&&!inherited?null:o.v);
    if(cur===o.v){c.classList.add('sel'); if(inherited)c.classList.add('inh');}
    wrap.appendChild(c);
  });
  return wrap;
}
function styleSel(wrap,kind){
  wrap.querySelectorAll('.chip.sel').forEach(c=>{
    const v=c.dataset.v, m={must:'must',neigung:'neigung',sehnsucht:'sehnsucht',
      interessant:'interessant',neutral:'neutral',soft:'soft',hard:'hard',na:'na',
      reizvoll:'reizvoll',echt:'echt',verbindlich:'verbindlich',gewuenscht:'gewuenscht',
      verhandelbar:'verhandelbar','nicht-noetig':'nicht-noetig',ablehnend:'ablehnend',

    if(v==='must')c.style.color='#1a1a1a';
